<style>
/* Layout: sticky tab bar over a single working column; day rows read as a run sheet. */
:root {

  --warn-bg: #fff4e0;
  --warn-line: #f0c27b;
  --closed-bg: #fdecec;
  --season: #0f766e;
  --engagement: #7c3aed;
  --special: #c2410c;
  --c-operations: #0f5c63;
  --c-show: #c2410c;
  --c-dining: #a16207;
  --c-activity: #15803d;
  --c-tour: #6d28d9;
  --c-other: #475569;
  --c-1: #0f5c63; --c-2: #c2410c; --c-3: #a16207; --c-4: #15803d; --c-5: #6d28d9; --c-6: #475569; --c-7: #be185d; --c-8: #1d4ed8;
  --radius: 12px;

  color-scheme: light;
}

  :root:not([data-theme="light"]) {
    --bg: #121718;
    --surface: #1a2122;
    --surface-2: #222a2b;
    --text: #e9eeee;
    --muted: #9aa8a9;
    --line: #2f3a3b;
    --brand: #3fb5bd;
    --brand-ink: #062426;
    --danger: #f87171;
    --warn-bg: #3a2e14;
    --warn-line: #7a5c1e;
    --closed-bg: #3a1d1d;
    --season: #2dd4bf;
    --engagement: #a78bfa;
    --special: #fb923c;
    --c-operations: #3fb5bd;
    --c-show: #fb923c;
    --c-dining: #facc15;
    --c-activity: #4ade80;
    --c-tour: #a78bfa;
    --c-other: #94a3b8;
    --c-1: #3fb5bd; --c-2: #fb923c; --c-3: #facc15; --c-4: #4ade80; --c-5: #a78bfa; --c-6: #94a3b8; --c-7: #f472b6; --c-8: #60a5fa;

  }
}
:root[data-theme="dark"] {
    --bg: #121718;
    --surface: #1a2122;
    --surface-2: #222a2b;
    --text: #e9eeee;
    --muted: #9aa8a9;
    --line: #2f3a3b;
    --brand: #3fb5bd;
    --brand-ink: #062426;
    --danger: #f87171;
    --warn-bg: #3a2e14;
    --warn-line: #7a5c1e;
    --closed-bg: #3a1d1d;
    --season: #2dd4bf;
    --engagement: #a78bfa;
    --special: #fb923c;
    --c-operations: #3fb5bd;
    --c-show: #fb923c;
    --c-dining: #facc15;
    --c-activity: #4ade80;
    --c-tour: #a78bfa;
    --c-other: #94a3b8;
    --c-1: #3fb5bd; --c-2: #fb923c; --c-3: #facc15; --c-4: #4ade80; --c-5: #a78bfa; --c-6: #94a3b8; --c-7: #f472b6; --c-8: #60a5fa;
    color-scheme: dark;

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font-body); }
h1, h2, h3, .brand b { font-family: var(--font-display); text-wrap: balance; }
h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; margin: 0; }
h3 { margin: 0 0 .25rem; font-size: 1rem; }
a { color: var(--brand); }
code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
small { display: block; color: var(--muted); font-size: .8rem; font-weight: 400; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.pad { padding: 2rem; }
.grow { flex: 1; }
.nowrap { white-space: nowrap; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
main.wrap { padding-top: 1.25rem; padding-bottom: 4rem; }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top-in { display: flex; align-items: center; gap: 1rem; min-height: 60px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.brand { display: flex; align-items: center; gap: .6rem; }
.brand b { font-size: 1rem; }
.logo { display: block; background: #0f5c63; border: 0; border-radius: 10px; padding: 5px 10px; cursor: pointer; line-height: 0; }
.logo:hover { background: #0c4c52; }
.logo img { height: 46px; width: auto; display: block; }
.brand-txt { border-left: 1px solid var(--line); padding-left: .6rem; }
@media print { .logo { background: #0f5c63 !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
.tabs.sub { margin: .5rem 0 1rem; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 8px 12px; border-radius: 8px; font: inherit; color: var(--muted); cursor: pointer; font-weight: 500; }
.tab:hover { background: var(--surface-2); color: var(--text); }
.tab.on { color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); }
.tabs.sub .tab { border-radius: 8px 8px 0 0; }
.tabs.sub .tab.on { box-shadow: inset 0 -2px 0 var(--brand); background: none; }

/* banners */
.banner { background: color-mix(in srgb, var(--brand) 10%, var(--bg)); border-bottom: 1px solid var(--line); padding: 10px 0; font-size: .9rem; }
.banner.warn { background: var(--warn-bg); }

/* buttons & form */
.btn { display: inline-flex; align-items: center; gap: .35rem; background: var(--brand); color: var(--brand-ink); border: 1px solid var(--brand); border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--surface); color: var(--text); border-color: var(--line); font-weight: 500; }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.btn.small { padding: 4px 10px; font-size: .85rem; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost.danger { background: var(--surface); color: var(--danger); border-color: var(--line); }
.btnrow { display: flex; gap: .5rem; flex-wrap: wrap; }
.btnrow.end { justify-content: flex-end; margin-top: 1rem; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
input[type="checkbox"], input[type="radio"] { width: auto; margin: 0; }
label { display: block; font-weight: 500; font-size: .9rem; margin-bottom: .75rem; }
label > input, label > select, label > textarea { margin-top: 4px; }
fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 .75rem; padding: .5rem .75rem .75rem; }
legend { font-weight: 500; font-size: .9rem; padding: 0 4px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
form.inline { display: flex; gap: .75rem; align-items: flex-end; flex-wrap: wrap; }
form.inline label { margin: 0; }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.day { display: inline-flex; align-items: center; gap: 4px; margin: 0; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-weight: 500; }
.day:has(input:checked) { background: color-mix(in srgb, var(--brand) 14%, transparent); border-color: var(--brand); }
.times { display: grid; gap: 6px; margin-bottom: 8px; }
.trow { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 6px; align-items: center; }
.trow .tl, .tr-only { display: none; }
form[data-transport] .trow { grid-template-columns: 8.5rem 1fr auto; }
form[data-transport] .trow .to, form[data-transport] .trow [name="te"], form[data-transport] .nt-only { display: none; }
form[data-transport] .trow .tl { display: block; margin: 0; }
form[data-transport] .tr-only { display: inline; }
.stops { display: grid; gap: 3px; }
.stop { display: flex; gap: .5rem; align-items: baseline; }
.stop .tchip { margin: 0; min-width: 5.6rem; text-align: center; }
.trcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .75rem; }
.trcard { margin: 0; }
.trcard table td { padding: .4rem .5rem; }
.trcard table td:first-child { width: 6.5rem; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.trcard .tr-head { display: flex; justify-content: space-between; gap: .5rem; align-items: flex-start; margin-bottom: .4rem; flex-wrap: wrap; }
table.bystop td, table.bystop th { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.bystop td:first-child { white-space: normal; min-width: 180px; }
fieldset.cd:has(input[value="inherit"]:checked) .cd-days { display: none; }
.chip.t-early { color: var(--special); border-color: color-mix(in srgb, var(--special) 50%, transparent); margin-top: 2px; }
.card.early { background: var(--warn-bg); border-color: var(--warn-line); }
.closlist td { vertical-align: middle; }
.closlist tr.month td { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; background: var(--surface-2); }
.ctrls { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
.ctrls select { width: auto; }
.ctrls label { margin: 0; display: inline-flex; align-items: center; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; font: inherit; font-size: .88rem; color: var(--muted); cursor: pointer; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); font-weight: 600; }
.toolbar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.actblock { border-top: 1px solid var(--line); padding: .6rem .9rem; background: var(--surface); }
.actblock:first-child { border-top: 0; }
.actblock.dragging { opacity: .4; }
.ab-head { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.grip { touch-action: none; cursor: grab; color: var(--muted); letter-spacing: -2px; user-select: none; font-weight: 700; padding: 0 2px; }
.ab-ctrl { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.ab-ctrl select { width: auto; padding: 4px 8px; font-size: .85rem; }
.ab-slots { margin: .4rem 0 0 1.5rem; display: grid; gap: 4px; }
.ab-slot { display: grid; grid-template-columns: 180px 1fr minmax(0, auto) auto; gap: .5rem; align-items: center; }
.ab-slot .actions .btn { margin-left: 4px; }
.ab-none { margin: .3rem 0 0 1.5rem; }
.dropzone { min-height: 48px; }
table.tb { table-layout: fixed; min-width: 640px; }
table.tb td:nth-child(1) { width: 30%; } table.tb td:nth-child(2) { width: 22%; } table.tb td:nth-child(4) { width: 18%; } table.tb td:nth-child(5) { width: 80px; }
.dropempty { padding: 1rem; text-align: center; color: var(--muted); font-size: .85rem; }
.dragitem.dragging { opacity: .4; }
.dragitem.ghosting { position: relative; z-index: 2; box-shadow: 0 6px 20px rgb(0 0 0 / .18); }
.r-name .grip { margin-right: .35rem; }
.actrow { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.actrow .grow { min-width: 160px; }
.actrow .anote { flex: 2 1 200px; color: var(--muted); font-size: .9rem; }
body.touchdrag { user-select: none; -webkit-user-select: none; }
.dropmark { height: 3px; background: var(--brand); border-radius: 2px; }
.catzone.dropover .rows { outline: 2px dashed color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 2px; }
.cat .count { color: var(--muted); font-weight: 500; letter-spacing: 0; text-transform: none; }
.crow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.crow input[type="text"], .crow input:not([type]) { flex: 1 1 160px; width: auto; }
.crow input[type="time"], .crow select { width: auto; }
.btn:disabled { opacity: .35; cursor: default; filter: none; }
@media (max-width: 720px) { .ab-slot { grid-template-columns: 1fr; gap: 2px; } .ab-slots, .ab-none { margin-left: 0; } }
.chip.t-open { color: var(--c-4); border-color: color-mix(in srgb, var(--c-4) 50%, transparent); background: color-mix(in srgb, var(--c-4) 9%, transparent); margin-top: 2px; }
.card.openday { background: color-mix(in srgb, var(--c-4) 9%, var(--surface)); border-color: color-mix(in srgb, var(--c-4) 40%, var(--line)); }
.dayacts { margin-top: .5rem; }
.hours { max-width: 620px; }
.hours .hcard { padding: 0; overflow: hidden; }
.hours .hhead { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .9rem 1.1rem .4rem; }
.hours .hhead h2 { font-size: 1.05rem; }
.hours .hsub { padding: 0 1.1rem .5rem; color: var(--muted); font-size: .88rem; }
.hours table td { padding: .5rem 1.1rem; font-variant-numeric: tabular-nums; }
.hours table td:first-child { width: 45%; }
.hours tr.today td { font-weight: 700; background: color-mix(in srgb, var(--brand) 6%, transparent); }
.hours .lbl { display: block; font-size: .82rem; color: var(--muted); }
.hours .closedtxt { color: var(--danger); font-weight: 600; }
.hours .rowedit { text-align: right; width: 1%; white-space: nowrap; }
.wkrow { display: grid; grid-template-columns: 7.5rem auto 1fr auto 1fr; gap: 6px; align-items: center; margin-bottom: 6px; }
.wkrow input[type=time] { margin: 0; }
.wkrow:has(input[type=checkbox]:not(:checked)) input[type=time] { opacity: .35; pointer-events: none; }
@media (max-width: 720px) { .wkrow { grid-template-columns: 1fr 1fr; } .wkrow .to { display: none; } }
.quick { border-top: 1px dashed var(--line); margin-top: .6rem; padding-top: .6rem; display: grid; gap: 6px; }
.quick .qrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.quick .qrow input { width: auto; flex: 1 1 140px; margin: 0; }
.quick .qrow input[type=number] { flex: 0 1 6.5rem; }
.quick .qrow input[type=time] { flex: 0 1 8rem; }
.quick .qhint { font-size: .78rem; color: var(--muted); }
.quick .qmode { gap: 4px; }
.quick:has(input[name=qmode][value=list]:checked) [data-m]:not([data-m=list]),
.quick:has(input[name=qmode][value=span]:checked) [data-m]:not([data-m=span]),
.quick:has(input[name=qmode][value=rep]:checked) [data-m]:not([data-m=rep]) { display: none; }
.ctoggle { cursor: pointer; user-select: none; border-radius: 6px; padding: 2px 4px; margin-left: -4px; }
.ctoggle:hover { background: var(--surface-2); }
.ctoggle .caret { display: inline-block; width: 1em; transition: transform .15s; color: var(--muted); font-size: .8em; order: -1; }
.collapsed > .ctoggle .caret, tr.catrow.collapsed .caret { transform: rotate(-90deg); }
.group.collapsed > :not(h2) { display: none !important; }
.group.collapsed { margin-bottom: .5rem; }
.group.collapsed.dropover > h2 { outline: 2px dashed color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 2px; }
tr.catrow td.ctoggle { cursor: pointer; }
.colctl { display: inline-flex; gap: 4px; }
@media print { .group.collapsed > :not(h2) { display: block !important; } .caret { display: none !important; } }
.cgrip { touch-action: none; cursor: grab; color: var(--muted); font-size: 1rem; line-height: 1; padding: 2px 4px; border-radius: 4px; letter-spacing: 0; text-transform: none; }
.cgrip:hover { background: var(--surface-2); color: var(--text); }
section.catzone.cdragging { opacity: .45; }
section.catzone.cdrop-before { box-shadow: 0 -4px 0 -1px var(--brand); }
section.catzone.cdrop-after { box-shadow: 0 4px 0 -1px var(--brand); }
.err { color: var(--danger); font-weight: 500; margin: 0 0 .75rem; }
/* shows per day: numbered Begin/End rows */
.showsbar { display: flex; gap: .5rem 1rem; flex-wrap: wrap; align-items: center; margin: 0 0 .6rem; padding: .5rem .6rem; background: var(--surface-2); border-radius: 8px; }
.showsbar label { margin: 0; display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; }
.showsbar input { width: 4.8rem; margin: 0; padding: 5px 8px; }
.showsbar .muted { font-size: .78rem; flex-basis: 100%; }
.times { counter-reset: show; }
.times .trow { counter-increment: show; grid-template-columns: 3.7rem 1fr auto 1fr auto; }
.times .trow::before { content: "Show " counter(show); font-size: .8rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.timehead { display: grid; grid-template-columns: 3.7rem 1fr auto 1fr auto; gap: 6px; font-size: .75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
.timehead span:nth-child(3) { visibility: hidden; }
form[data-transport] .times .trow { grid-template-columns: 3.7rem 8.5rem 1fr auto; }
form[data-transport] .times .trow::before { content: "Stop " counter(show); }
form[data-transport] .showsbar, form[data-transport] .timehead { display: none; }
.edtimes { display: grid; gap: 6px; margin-bottom: .75rem; }
.edtimes .ab-slot { grid-template-columns: 1fr; gap: 2px; padding: .5rem .6rem; border: 1px solid var(--line); border-radius: 8px; }
/* Island Villages: island → presentations / hands-on */
.kind-head { padding: .3rem 1rem .3rem 1.6rem; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--muted); background: var(--surface); border-top: 1px solid var(--line); display: flex; align-items: center; gap: .45rem; }
.kind-head::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--cc, var(--muted)); }
.kind-head .count { font-weight: 500; letter-spacing: 0; text-transform: none; }
tr.kindrow td { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--muted); padding: .3rem .8rem .3rem 1.6rem; background: var(--surface); }
.villages { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 1rem; align-items: start; }
.village { margin: 0; padding: 0; overflow: hidden; }
.vhead { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; padding: .8rem 1rem; background: color-mix(in srgb, var(--brand) 7%, var(--surface)); border-bottom: 1px solid var(--line); }
.vhead h2 { font-size: 1.2rem; }
.vkind { padding: .7rem 1rem .9rem; }
.vkind + .vkind { border-top: 1px solid var(--line); }
.vkhead { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-bottom: .45rem; }
.vkhead h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; margin: 0; display: flex; align-items: center; gap: .45rem; }
.vkhead h3::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--cc); }
.vkhead .count { color: var(--muted); font-weight: 500; letter-spacing: 0; text-transform: none; }
.vlist { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.vlist li { border: 1px solid var(--line); border-radius: 8px; padding: .55rem .65rem; display: grid; gap: .35rem; min-width: 0; }
.vtop { display: flex; justify-content: space-between; gap: .5rem; align-items: flex-start; flex-wrap: wrap; }
.vtop > div:first-child { min-width: 0; }
.vslot { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; }
.vslot .vdays { font-size: .75rem; color: var(--muted); font-weight: 600; margin-right: 4px; white-space: nowrap; }
.vnone { margin: 0; }
/* island sub-groups inside a category */
.isle-head { display: flex; align-items: baseline; gap: .4rem; padding: .5rem 1rem .4rem; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--cc, var(--brand)) 7%, var(--surface)); font-family: var(--font-display); font-weight: 700; font-size: .92rem; color: var(--text); }
.isle-head:first-child { border-top: 0; }
.isle-head .count { font-family: var(--font-body); font-weight: 500; font-size: .8rem; color: var(--muted); }

<script type="module">
// PCC Schedule Hub — claude.ai Artifact build. Data lives in the artifact's

// ---------- constants ----------
// Default categories; editors can rename, reorder, recolor, add and remove them (doc.categories).
const DEFAULT_CATEGORIES = [
  { id: "operations", name: "Operational Hours", color: 1 },
  { id: "activity", name: "Daytime", color: 4 },
  { id: "dining", name: "Dining", color: 3 },
  { id: "show", name: "Evening Show", color: 2 },
  { id: "special", name: "Special Events", color: 7 },
];
// Default time-of-day blocks (doc.timeBlocks); each runs from its start until the next block's start.
const DEFAULT_TIME_BLOCKS = [
  { id: "tb-day", name: "Daytime", start: "00:00" },
  { id: "tb-dinner", name: "Dinner", start: "16:30" },
  { id: "tb-evening", name: "Evening", start: "19:00" },

const DEFAULT_ISLANDS = [
  { id: "isl-aotearoa", name: "Aotearoa" },
  { id: "isl-fiji", name: "Fiji" },
  { id: "isl-hawaii", name: "Hawaiʻi" },
  { id: "isl-samoa", name: "Samoa" },
  { id: "isl-tahiti", name: "Tahiti" },
  { id: "isl-tonga", name: "Tonga" },
];
const PARK_WIDE = "Around the park";
// Categories shown together as "Island Villages": island first, then these as sub-sections.
const VILLAGE_TITLE = "Island Villages";
const VILLAGE_KINDS = [
  { id: "presentations", name: "Culture Presentations", add: "+ Presentation", color: 5 },
  { id: "handson", name: "Hands-On Activities", add: "+ Hands-on activity", color: 4 },
];
const COLOR_NAMES = ["Teal", "Orange", "Gold", "Green", "Purple", "Slate", "Rose", "Blue"];
const PROGRAM_TYPES = {
  season: { label: "Season", rank: 1 },
  engagement: { label: "Engagement", rank: 2 },
  special: { label: "Special Event", rank: 3 },
};
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DAYS_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const DEFAULT_CLOSED_DAYS = [0, 3]; // Sunday & Wednesday

// ---------- small utils ----------
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) =>
  String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const uid = (p) => `${p}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }

const pad = (n) => String(n).padStart(2, "0");
const toStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const todayStr = () => toStr(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return toStr(d); };
const dow = (s) => parse(s).getDay();
const fmtDate = (s, opts = { weekday: "long", month: "long", day: "numeric", year: "numeric" }) =>
  parse(s).toLocaleDateString("en-US", opts);
const fmtShort = (s) => fmtDate(s, { month: "short", day: "numeric", year: "numeric" });
const toMin = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
function fmtTime(hhmm) {
  if (!hhmm) return "";
  let [h, m] = hhmm.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return m ? `${h}:${pad(m)} ${ap}` : `${h} ${ap}`;
}
const fmtRange = (t) => (t.end ? `${fmtTime(t.start)} – ${fmtTime(t.end)}` : fmtTime(t.start));
const stopName = (id) => state.doc?.stops.find((x) => x.id === id)?.name || "";
const fmtT = (t) => fmtRange(t) + (t.stopId && stopName(t.stopId) ? ` · ${stopName(t.stopId)}` : "");
const tchip = (t) => `<span class="tchip">${esc(fmtT(t))}</span>`;
const mainAct = () => state.doc.activities.find((a) => a.id === state.doc.mainHoursId) || state.doc.activities.find((a) => /park hours/i.test(a.name)) || state.doc.activities.find((a) => catOf(a)?.id === "operations") || null;
const isTransport = (a) => catOf(a)?.id === "transport";
const daysLabel = (days) => {
  const s = [...days].sort().join(",");
  if (s === "0,1,2,3,4,5,6") return "Every day";
  if (s === "1,2,3,4,5,6") return "Mon – Sat";
  if (s === "1,2,3,4,5") return "Mon – Fri";
  return [...days].sort().map((d) => DAYS[d]).join(", ");
};
const closedLabel = (days) => (days.length ? [...days].sort().map((d) => DAYS[d]).join(", ") : "None — open every day");
const cats = () => state.doc.categories;
const catOf = (a) => cats().find((c) => c.id === a?.category) || cats().find((c) => c.id === "other") || cats().find((c) => c.id === "activity") || cats()[0];
const catName = (id) => catOf({ category: id })?.name || "";
const ccStyle = (c) => `style="--cc: var(--c-${c?.color || 6})"`;
const blocks = () => [...state.doc.timeBlocks].sort((a, b) => toMin(a.start) - toMin(b.start));
const blockOf = (hhmm) => { const bl = blocks(); let cur = bl[0]; for (const b of bl) if (toMin(b.start) <= toMin(hhmm)) cur = b; return cur; };
function blockSpan(b) {
  const bl = blocks(), i = bl.indexOf(b), next = bl[i + 1];
  if (i === 0 && next) return `until ${fmtTime(next.start)}`;
  return next ? `${fmtTime(b.start)} – ${fmtTime(next.start)}` : `from ${fmtTime(b.start)}`;
}
// Collapsible category / time-block headings, remembered per viewer.
let collapsed = new Set();
try { collapsed = new Set(JSON.parse(lsGet("pcc.collapsed") || "[]")); } catch {}
const isCol = (key) => collapsed.has(key);
const saveCol = () => lsSet("pcc.collapsed", JSON.stringify([...collapsed]));
const colCls = (key) => (isCol(key) ? " collapsed" : "");
const catHead = (key, title, style = "", catId = null) =>
  `<h2 class="cat ctoggle" ${style} data-action="toggleCat" data-key="${esc(key)}" role="button" tabindex="0" aria-expanded="${!isCol(key)}">${catId && state.canEdit ? `<span class="cgrip no-print" draggable="true" data-cgrip="${esc(catId)}" title="Drag to reorder categories" aria-label="Reorder category">⠿</span>` : ""}<span class="caret" aria-hidden="true">▾</span>${title}</h2>`;
const colCtl = (scope) => `<span class="colctl no-print"><button class="btn ghost small" data-action="colAll" data-scope="${scope}" data-mode="collapse">Collapse all</button><button class="btn ghost small" data-action="colAll" data-scope="${scope}" data-mode="expand">Expand all</button></span>`;
const seg = (action, cur, items) =>
  `<div class="seg no-print" role="group">${items.map(([id, label]) => `<button type="button" class="${cur === id ? "on" : ""}" data-action="${action}" data-id="${id}" aria-pressed="${cur === id}">${label}</button>`).join("")}</div>`;

// ---------- state ----------
const state = {
  doc: null,
  canEdit: false,
  offline: false,
  view: lsGet("pcc.view") || "day",
  date: todayStr(),
  manageTab: "villages",
  programId: null,
  me: null,
  log: null,
  names: {},
  trMode: lsGet("pcc.trMode") || "run",
  dayGroup: lsGet("pcc.dayGroup") || "category",
  baseGroup: lsGet("pcc.baseGroup") || "category",
  closRange: Number(lsGet("pcc.closRange")) || 90,
  closWeekly: lsGet("pcc.closWeekly") !== "0",
};
const emptyDoc = () => ({ islands: structuredClone(DEFAULT_ISLANDS), dayOverrides: [], stops: [], venues: [], activities: [], programs: [], slots: [], closures: [], closedDays: [...DEFAULT_CLOSED_DAYS], categories: structuredClone(DEFAULT_CATEGORIES), timeBlocks: structuredClone(DEFAULT_TIME_BLOCKS) });

const byId = (list, id) => state.doc[list].find((x) => x.id === id);
const venueName = (id) => byId("venues", id)?.name || "";
const islands = () => state.doc.islands || [];
const islandName = (id) => islands().find((i) => i.id === id)?.name || "";
// Split a category's items into island groups (islands-list order), then items with no island.
// A category with no island activities comes back as a single unlabelled group.
function byIsland(items, actOf) {
  const known = new Set(islands().map((i) => i.id));
  if (!items.some((x) => known.has(actOf(x).islandId))) return [{ island: null, items }];
  const out = [];
  for (const isl of islands()) {
    const list = items.filter((x) => actOf(x).islandId === isl.id);
    if (list.length) out.push({ island: isl, items: list });
  }
  const rest = items.filter((x) => !known.has(actOf(x).islandId));
  if (rest.length) out.push({ island: { id: "", name: PARK_WIDE }, items: rest });
  return out;
}
const villageCats = () => VILLAGE_KINDS.map((k) => cats().find((c) => c.id === k.id)).filter(Boolean);
const isVillageCat = (c) => VILLAGE_KINDS.some((k) => k.id === c?.id);
// Island Villages grouping: one group per island × kind, in island order then kind order.
// Each group carries the island (head shown on its first group) and the kind sub-heading.
function byVillage(items, actOf) {
  const vc = villageCats(), known = new Set(islands().map((i) => i.id)), out = [];
  for (const isl of [...islands(), { id: "", name: "No island set" }]) {
    const inIsl = items.filter((x) => (isl.id ? actOf(x).islandId === isl.id : !known.has(actOf(x).islandId)));
    let first = true;
    for (const c of vc) {
      const list = inIsl.filter((x) => catOf(actOf(x)) === c);
      if (!list.length) continue;
      out.push({ island: isl, kind: c, items: list, showIsland: first, islandCount: inIsl.length });
      first = false;
    }
  }
  return out;
}
const islandHead = (g) =>
  (g.island && g.showIsland !== false ? `<div class="isle-head">${esc(g.island.name)} <span class="count">· ${g.islandCount ?? g.items.length}</span></div>` : "") +
  (g.kind ? `<div class="kind-head" ${ccStyle(g.kind)}>${esc(g.kind.name)} <span class="count">· ${g.items.length}</span></div>` : "");
const repsLabel = (times) => (times.length > 1 ? `<span class="reps">${times.length} times a day</span>` : "");
const programStatus = (p, ds = todayStr()) => (ds < p.start ? "upcoming" : ds > p.end ? "past" : "active");

// ---------- storage (artifact db) ----------
let db = null, userApi = null, downloadsApi = null, scheduleRef = null, logRef = null;
let writeChain = Promise.resolve();
const enqueue = (fn) => (writeChain = writeChain.then(fn, fn));
const LIST_KEYS = ["venues", "activities", "programs", "slots", "closures", "stops", "dayOverrides"];

function normalize(data) {
  const doc = structuredClone(data || {});
  for (const k of LIST_KEYS) if (!Array.isArray(doc[k])) doc[k] = [];
  if (!Array.isArray(doc.closedDays)) doc.closedDays = [...DEFAULT_CLOSED_DAYS];
  if (!Array.isArray(doc.categories) || !doc.categories.length) doc.categories = structuredClone(DEFAULT_CATEGORIES);
  if (!Array.isArray(doc.timeBlocks) || !doc.timeBlocks.length) doc.timeBlocks = structuredClone(DEFAULT_TIME_BLOCKS);
  if (!Array.isArray(doc.islands)) doc.islands = structuredClone(DEFAULT_ISLANDS);
  return doc;
}

async function load() {
  render();
  const use = (n) => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  [db, userApi, downloadsApi] = await Promise.all([use("db"), use("user"), use("downloads")]);

    state.offline = true;
    state.doc = emptyDoc();
    render();
    return;
  }

  state.me = userApi ? await userApi.id() : null;

  logRef = db.doc("schedule/log");
  scheduleRef.onSnapshot(
    (snap) => {
      state.doc = snap.exists ? normalize(snap.data()) : emptyDoc();
      render();
    },
    () => toast("Lost the live connection to the schedule. Reload the page to reconnect.", true),
  );
}

// Apply a change locally, then save it for everyone. Reverts on failure.
async function commit(summary, mutate) {
  if (!state.canEdit || !scheduleRef) return toast("You have view-only access to this schedule.", true);
  const before = state.doc;
  const next = structuredClone(state.doc);
  mutate(next);
  const at = new Date().toISOString();
  Object.assign(next, { updatedAt: at, updatedBy: state.me });
  if (JSON.stringify(next).length > 1_500_000) return toast("The schedule is too large to save. Remove old seasons or events, then try again.", true);
  state.doc = next;
  render();
  try {
    await enqueue(() => scheduleRef.set(next, { summary }));
    toast("Saved");
    enqueue(async () => {
      const snap = await logRef.get();
      const entries = snap.exists ? [...(snap.data().entries || [])] : [];
      entries.unshift({ at, by: state.me, summary: String(summary).slice(0, 200) });
      await logRef.set({ entries: entries.slice(0, 300) });
      state.log = null;
      if (state.view === "log") render();
    }).catch(() => {});

    state.doc = before;
    if (e?.code === "invalid_argument") {
      state.canEdit = false;
      toast("You have view-only access to this schedule. Ask the owner for Contributor access to edit.", true);
    } else if (e?.code === "conflict") {
      toast("Someone else saved a change just now. The latest schedule is loaded; please make your edit again.", true);
    } else if (e?.code === "quota_exceeded") {
      toast("The schedule storage is full. Remove old seasons or events, then try again.", true);
    } else {
      toast("Couldn't save. Check your connection and try again.", true);
    }
    render();
  }

// ---------- schedule resolution ----------
// For a date: base schedule, overridden per-activity by the highest-ranked
// active program (season < engagement < special event) that has times on that weekday.
// Closures (dated or weekly) hide everything except special events.
// Weekly closed days: the highest-ranked active program with its own setting wins,
// otherwise the regular weekly closed days apply.
const weeklyOwner = (active) => {
  const rank = (p) => PROGRAM_TYPES[p.type]?.rank ?? 1;

function weeklyClosure(ds, active) {
  const d = dow(ds);
  const owner = weeklyOwner(active);
  const days = owner ? owner.closedDays : state.doc.closedDays;
  if (!days.includes(d)) return null;
  return owner
    ? { name: `${DAYS_LONG[d]} closure`, note: `Closed ${DAYS_LONG[d]}s during ${owner.name}.`, weekly: true }
    : { name: `${DAYS_LONG[d]} closure`, note: `Regular weekly closed day.`, weekly: true };
}

// Does a dated closure apply on this date? Optional weekday filter.
const closureHits = (c, ds) => c.start <= ds && ds <= (c.end || c.start) && (!c.days?.length || c.days.includes(dow(ds)));
const activeOn = (ds) => new Map(state.doc.programs.filter((p) => p.start <= ds && ds <= p.end).map((p) => [p.id, p]));

// Full-day closure (dated or weekly) wins over an early close (dated closure with a "from" time).
// Date changes (doc.dayOverrides) beat everything: open a normally closed date (running another
// weekday's schedule) or close a normally open one. A season can also open a regular closed weekday.
const overrideOn = (ds) => state.doc.dayOverrides.find((o) => o.date === ds);
const nextOpenDay = (d) => { for (let i = 1; i <= 7; i++) { const k = (d + i) % 7; if (!state.doc.closedDays.includes(k)) return k; } return d; };
function closuresFor(ds, active = activeOn(ds)) {
  const d = dow(ds), ov = overrideOn(ds);
  const dated = state.doc.closures.filter((c) => closureHits(c, ds));
  const earlyOf = () => dated.filter((c) => c.from).sort((a, b) => toMin(a.from) - toMin(b.from))[0] || null;
  if (ov?.status === "closed")
    return { closure: { name: ov.reason || "Closed", note: "Date change", override: ov }, earlyClose: null, runAs: d, opening: null };
  if (ov?.status === "open") {
    const runAs = Number.isInteger(ov.runAs) ? ov.runAs : d;
    return { closure: null, earlyClose: earlyOf(), runAs, opening: { name: ov.reason || "Special opening", runAs, override: ov } };
  }
  const closure = dated.find((c) => !c.from) || weeklyClosure(ds, active);
  let runAs = d, opening = null;
  if (!closure && state.doc.closedDays.includes(d)) {
    const owner = weeklyOwner(active);
    runAs = Number.isInteger(owner?.openRunAs) ? owner.openRunAs : nextOpenDay(d);
    opening = { name: owner ? owner.name : "Special opening", runAs, season: owner };
  }
  return { closure, earlyClose: closure ? null : earlyOf(), runAs, opening };
}

const closureWhen = (c) =>
  `${fmtShort(c.start)}${c.end && c.end !== c.start ? ` – ${fmtShort(c.end)}` : ""}${c.days?.length ? ` · ${c.days.length === 1 ? DAYS_LONG[c.days[0]] + "s" : closedLabel(c.days)} only` : ""}${c.from ? ` · from ${fmtTime(c.from)}` : " · all day"}`;

function resolveDay(ds) {
  const doc = state.doc;
  const active = new Map(doc.programs.filter((p) => p.start <= ds && ds <= p.end).map((p) => [p.id, p]));
  const { closure, earlyClose, runAs, opening } = closuresFor(ds, active);
  const d = runAs; // weekday whose schedule applies
  const ovHours = opening?.override?.hours?.start ? opening.override.hours : null;
  const main = mainAct();
  let cutStr = earlyClose ? earlyClose.from : null;
  if (ovHours?.end && (!cutStr || toMin(ovHours.end) < toMin(cutStr))) cutStr = ovHours.end;
  const cutoff = cutStr ? toMin(cutStr) : null;
  const rankOf = (s) => (s.programId ? PROGRAM_TYPES[active.get(s.programId).type]?.rank ?? 1 : 0);
  const rows = [];
  for (const a of doc.activities) {
    if (ovHours && a === main) {
      rows.push({ activity: a, times: [{ start: ovHours.start, end: ovHours.end || "" }], cancelled: false, cut: false, slots: [], source: null, special: true,
        notes: [opening.override.reason ? `Special hours — ${opening.override.reason}` : "Special hours"] });
      continue;
    }
    const cands = doc.slots.filter(
      (s) => s.activityId === a.id && s.days.includes(d) && (s.programId == null || active.has(s.programId)),
    );
    if (!cands.length) continue;
    const max = Math.max(...cands.map(rankOf));
    if (closure && max < 3) continue;
    const chosen = cands.filter((s) => rankOf(s) === max);
    const running = chosen.filter((s) => s.status !== "cancelled");
    let times = running.flatMap((s) => s.times).sort((x, y) => toMin(x.start) - toMin(y.start))
      .filter((t, i, arr) => !arr.slice(0, i).some((u) => u.start === t.start && (u.end || "") === (t.end || "") && (u.stopId || "") === (t.stopId || "")));
    const notes = chosen.map((s) => s.note).filter(Boolean);
    let cut = false;
    if (cutoff != null && max < 3) {
      const kept = times
        .filter((t) => toMin(t.start) < cutoff)
        .map((t) => (t.end && toMin(t.end) > cutoff ? { ...t, end: cutStr } : t));
      cut = kept.length !== times.length || kept.some((t, i) => t !== times[i]);
      times = kept;
      if (cut) notes.push(`Park closes at ${fmtTime(cutStr)}`);
    }
    rows.push({
      activity: a,
      times,
      cancelled: !times.length,
      cut,
      slots: chosen,
      source: chosen[0].programId ? active.get(chosen[0].programId) : null,
      notes,
    });
  }
  return { ds, closure, earlyClose, opening, programs: [...active.values()], rows, conflicts: findConflicts(rows) };
}

// Two different activities in the same venue with overlapping times.
function findConflicts(rows) {
  const out = [];
  const items = rows
    .filter((r) => !r.cancelled && r.activity.venueId && r.activity.category !== "operations")
    .flatMap((r) => r.times.map((t) => ({
      r, t, s: toMin(t.start), e: t.end ? toMin(t.end) : toMin(t.start) + 1,
    })));
  for (let i = 0; i < items.length; i++)
    for (let j = i + 1; j < items.length; j++) {
      const a = items[i], b = items[j];
      if (a.r === b.r || a.r.activity.venueId !== b.r.activity.venueId) continue;
      if (a.s < b.e && b.s < a.e) out.push({ a, b });
    }
  return out;
}

// ---------- rendering ----------
function render() {
  const app = $("#app");
  if (!state.doc) { app.innerHTML = `<p class="muted pad">Loading…</p>`; return; }
  if (state.view === "manage" && !state.canEdit) state.view = "day";
  const views = { hours: hoursView, transport: transportView, closures: closuresView, day: dayView, week: weekView, programs: programsView, manage: manageView, log: logView };
  app.innerHTML = header() + banner() + `<main class="wrap">${(views[state.view] || dayView)()}</main>`;
  if (state.view === "log" && !state.log) loadLog();
}

    return `<div class="banner"><div class="wrap">This schedule holds <b>sample entries with placeholder times</b>. ${state.canEdit ? "Edit them in <b>Manage</b>, or clear them from Manage → Data." : "An editor needs to replace them with real times."}</div></div>`;
  if (!state.doc.activities.length)
    return `<div class="banner"><div class="wrap">No activities yet. ${state.canEdit ? "Start in <b>Manage → Activities</b>, then add their times under <b>Regular schedule</b>." : "An editor needs to add them."}</div></div>`;
  return "";
}

function dateNav(step, label) {
  return `<div class="datenav no-print">
    <button class="btn ghost" data-action="shift" data-n="${-step}" aria-label="Previous">‹</button>
    <input type="date" value="${state.date}" data-action="pickdate" aria-label="Pick date">
    <button class="btn ghost" data-action="shift" data-n="${step}" aria-label="Next">›</button>
    <button class="btn ghost" data-action="today">Today</button>
    <span class="grow"></span>
    ${label}
  </div>`;
}

function programChip(p) {
  return `<span class="chip t-${p.type}">${esc(PROGRAM_TYPES[p.type]?.label)}: ${esc(p.name)}</span>`;
}

const openingNote = (ds, o) => {
  const d = dow(ds);
  const normally = state.doc.closedDays.includes(d) ? `Normally closed on ${DAYS_LONG[d]}s. ` : "";
  return esc(normally + (o.runAs !== d ? `Running the ${DAYS_LONG[o.runAs]} schedule.` : `Running the regular ${DAYS_LONG[d]} schedule.`));
};

function dayView() {
  const r = resolveDay(state.date);
  const isToday = state.date === todayStr();
  let html = dateNav(1, "");
  html += `<div class="dayhead"><div><h1>${esc(fmtDate(state.date))}${isToday ? ` <span class="pill">Today</span>` : ""}</h1>
    <div class="chips">${r.programs.map(programChip).join("")}</div></div>
    <div><div class="toolbar">${seg("dayGroup", state.dayGroup, [["category", "By category"], ["time", "By time of day"]])}${colCtl("day")}</div>
    ${state.canEdit ? `<div class="btnrow dayacts no-print">${r.closure ? `<button class="btn ghost small" data-action="openDay" data-d="${state.date}">Open this day</button>` : `<button class="btn ghost small" data-action="closeDay" data-d="${state.date}">Close this day</button>`}<button class="btn ghost small" data-action="swapDays" data-d="${state.date}">Swap days</button>${overrideOn(state.date) ? `<button class="btn ghost small danger" data-action="delOverride" data-id="${overrideOn(state.date).id}">Undo date change</button>` : ""}</div>` : ""}</div></div>`;
  if (r.opening)
    html += `<div class="card openday"><b>Open — ${esc(r.opening.name)}</b><div class="muted">${openingNote(state.date, r.opening)}</div></div>`;
  if (r.closure)
    html += `<div class="card closed"><b>Closed — ${esc(r.closure.name)}</b>${r.closure.note ? `<div class="muted">${esc(r.closure.note)}</div>` : ""}</div>`;
  if (r.earlyClose)
    html += `<div class="card early"><b>Closes early at ${esc(fmtTime(r.earlyClose.from))} — ${esc(r.earlyClose.name)}</b><div class="muted">${r.earlyClose.note ? `${esc(r.earlyClose.note)} · ` : ""}Times after ${esc(fmtTime(r.earlyClose.from))} are removed or shortened. Special events still run.</div></div>`;
  if (r.conflicts.length)
    html += `<div class="card warnbox no-print"><b>⚠ ${r.conflicts.length} venue conflict${r.conflicts.length > 1 ? "s" : ""}</b><ul>${r.conflicts
      .map(({ a, b }) => `<li>${esc(a.r.activity.name)} (${fmtRange(a.t)}) overlaps ${esc(b.r.activity.name)} (${fmtRange(b.t)}) at ${esc(venueName(a.r.activity.venueId))}</li>`)
      .join("")}</ul></div>`;
  if (!r.rows.length) {
    if (!r.closure) html += `<div class="card empty">Nothing scheduled on this day.</div>`;
    return html;
  }
  const dragOK = state.canEdit && state.dayGroup !== "time";
  const rowHtml = (x, times = x.times) => `<div class="row ${x.cancelled ? "cancelled" : ""}${dragOK ? " dragitem" : ""}"${dragOK ? ` draggable="true" data-act="${x.activity.id}"` : ""}>
        <div class="r-name">${dragOK ? `<span class="grip no-print" title="Drag to another category" aria-hidden="true">⋮⋮</span>` : ""}<b>${esc(x.activity.name)}</b><small>${esc(venueName(x.activity.venueId))}</small></div>
        <div class="r-times">${x.cancelled ? `<span class="tchip off">${x.cut ? "After closing" : "Not running"}</span>` : isTransport(x.activity) ? stopList(times) : times.map(tchip).join("") + (times === x.times ? repsLabel(times) : "")}</div>
        <div class="r-src">${x.special ? `<span class="chip t-open">Special hours</span>` : x.source ? programChip(x.source) : `<span class="chip t-base">Regular</span>`}${x.notes.map((n) => `<div class="muted small">${esc(n)}</div>`).join("")}</div>
      </div>`;
  const section = (key, title, style, inner) => `<section class="group${colCls(key)}" ${style}>${catHead(key, title, style)}<div class="rows">${inner}</div></section>`;
  if (state.dayGroup === "time") {
    for (const b of blocks()) {
      const rs = r.rows
        .filter((x) => !x.cancelled)
        .map((x) => ({ x, times: isTransport(x.activity) ? (x.times.length && blockOf(x.times[0].start) === b ? x.times : []) : x.times.filter((t) => blockOf(t.start) === b) }))
        .filter((y) => y.times.length)
        .sort((p, q) => toMin(p.times[0].start) - toMin(q.times[0].start));
      if (rs.length) html += section(`day:tb:${b.id}`, `${esc(b.name)} <span class="count">· ${esc(blockSpan(b))}</span>`, `style="--cc: var(--brand)"`, rs.map((y) => rowHtml(y.x, y.times)).join(""));
    }
    const off = r.rows.filter((x) => x.cancelled);
    if (off.length) html += section("day:off", "Not running", `style="--cc: var(--danger)"`, off.map((x) => rowHtml(x)).join(""));
    return html;
  }
  let vDone = false;
  for (const c of cats()) {
    const vil = isVillageCat(c);
    if (vil && vDone) continue;
    if (vil) vDone = true;
    const rows = r.rows.filter((x) => (vil ? isVillageCat(catOf(x.activity)) : catOf(x.activity) === c));
    const inner = (vil ? byVillage(rows, (x) => x.activity) : byIsland(rows, (x) => x.activity)).map((g) => islandHead(g) + g.items.map((x) => rowHtml(x)).join("")).join("");
    if (rows.length && vil) html += section("day:villages", `${VILLAGE_TITLE} <span class="count">· ${rows.length}</span>`, ccStyle(c), inner);
    else if (rows.length) html += dragOK
      ? `<section class="group catzone${colCls(`day:${c.id}`)}" data-cat="${c.id}" ${ccStyle(c)}>${catHead(`day:${c.id}`, `${esc(c.name)} <span class="count">· ${rows.length}</span>`, ccStyle(c), c.id)}<div class="rows dropzone">${inner}</div></section>`
      : section(`day:${c.id}`, `${esc(c.name)} <span class="count">· ${rows.length}</span>`, ccStyle(c), inner);
  }
  return html;
}

function weekView() {
  const d = dow(state.date);
  const start = addDays(state.date, -((d + 6) % 7)); // Monday
  const dates = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const days = dates.map(resolveDay);
  const acts = state.doc.activities.filter((a) => days.some((r) => r.rows.some((x) => x.activity === a)));
  let html = dateNav(7, `${colCtl("week")}<span class="muted">Week of ${esc(fmtShort(start))}</span>`);
  html += `<div class="tablewrap"><table class="week"><thead><tr><th>Activity</th>${dates
    .map((ds, i) => `<th class="${ds === todayStr() ? "today" : ""}"><a href="#" data-action="goday" data-d="${ds}">${DAYS[parse(ds).getDay()]} ${parse(ds).getDate()}</a>
      ${days[i].closure ? `<div class="chip t-closed">Closed</div>` : ""}${days[i].opening ? `<div class="chip t-open" title="${esc(openingNote(ds, days[i].opening))}">Open${days[i].opening.runAs !== dow(ds) ? ` · ${DAYS[days[i].opening.runAs]} sched.` : ""}</div>` : ""}${days[i].earlyClose ? `<div class="chip t-early" title="${esc(days[i].earlyClose.name)}">Closes ${esc(fmtTime(days[i].earlyClose.from))}</div>` : ""}${days[i].programs.map((p) => `<div class="dot t-${p.type}" title="${esc(p.name)}"></div>`).join("")}</th>`)
    .join("")}</tr></thead><tbody>`;
  let vDone = false;
  for (const c of cats()) {
    const vil = isVillageCat(c);
    if (vil && vDone) continue;
    if (vil) vDone = true;
    const list = acts.filter((a) => (vil ? isVillageCat(catOf(a)) : catOf(a) === c));
    if (!list.length) continue;
    const wk = vil ? "week:villages" : `week:${c.id}`;
    html += `<tr class="catrow${colCls(wk)}"><td colspan="8" class="ctoggle" ${ccStyle(c)} data-action="toggleCat" data-key="${wk}" role="button" tabindex="0" aria-expanded="${!isCol(wk)}"><span class="caret" aria-hidden="true">▾</span> ${esc(vil ? VILLAGE_TITLE : c.name)} <span class="count">· ${list.length}</span></td></tr>`;
    if (isCol(wk)) continue;
    for (const g of (vil ? byVillage(list, (a) => a) : byIsland(list, (a) => a))) {
    if (g.island && g.showIsland !== false) html += `<tr class="islandrow"><td colspan="8">${esc(g.island.name)}</td></tr>`;
    if (g.kind) html += `<tr class="kindrow"><td colspan="8">${esc(g.kind.name)}</td></tr>`;
    for (const a of g.items) {
      html += `<tr><th scope="row">${esc(a.name)}<small>${esc(venueName(a.venueId))}</small></th>`;
      for (const r of days) {
        const x = r.rows.find((y) => y.activity === a);
        html += `<td class="${x?.source ? `src t-${x.source.type}` : ""}">${
          !x ? `<span class="muted">—</span>` : x.cancelled ? `<span class="tchip off">Off</span>` : isTransport(a) && x.times.length > 1 ? `<div>${fmtTime(x.times[0].start)} – ${fmtTime(x.times[x.times.length - 1].start)}</div><small>${x.times.length} stops</small>` : x.times.map((t) => `<div>${esc(fmtT(t))}</div>`).join("")
        }</td>`;
      }
      html += `</tr>`;
    }
    }
  }
  html += `</tbody></table></div>`;
  if (!acts.length) html += `<div class="card empty">Nothing scheduled this week.</div>`;
  html += `<p class="muted small legend"><span class="dot t-season"></span> Season <span class="dot t-engagement"></span> Engagement <span class="dot t-special"></span> Special event — tinted cells use program times instead of the regular schedule.</p>`;
  return html;
}

const stopList = (times) => `<div class="stops">${times.map((t) => `<div class="stop"><span class="tchip">${esc(fmtTime(t.start))}</span><span>${esc(stopName(t.stopId) || "—")}</span></div>`).join("")}</div>`;

// Transportation: every pickup / return run on the chosen day, by run or by pickup location.
function transportView() {
  const r = resolveDay(state.date);
  const runs = r.rows.filter((x) => isTransport(x.activity));
  const anyRuns = state.doc.activities.some(isTransport);
  let html = dateNav(1, "");
  html += `<div class="dayhead"><div><h1>Transportation</h1><div class="muted">${esc(fmtDate(state.date))}</div></div>
    <div class="toolbar">${seg("trMode", state.trMode, [["run", "By run"], ["stop", "By pickup location"]])}${state.canEdit ? `<button class="btn no-print" data-action="newRun">+ New bus run</button>` : ""}<button class="btn ghost no-print" data-action="print">Print</button></div></div>`;
  if (r.closure) html += `<div class="card closed"><b>Closed — ${esc(r.closure.name)}</b>${r.closure.note ? `<div class="muted">${esc(r.closure.note)}</div>` : ""}</div>`;
  if (r.earlyClose) html += `<div class="card early"><b>Closes early at ${esc(fmtTime(r.earlyClose.from))} — ${esc(r.earlyClose.name)}</b></div>`;
  if (!anyRuns) return html + `<div class="card empty">No bus runs yet.${state.canEdit ? " Use <b>+ New bus run</b> to add one." : ""}</div>`;
  if (state.trMode === "stop") {
    if (!runs.some((x) => !x.cancelled)) return html + (r.closure ? "" : `<div class="card empty">No transportation running on this day.</div>`);
    const live = runs.filter((x) => !x.cancelled);
    const ids = [...state.doc.stops.map((x) => x.id), ""];
    html += `<div class="tablewrap"><table class="list bystop"><thead><tr><th>Pickup location</th>${live.map((x) => `<th>${esc(x.activity.name)}</th>`).join("")}</tr></thead><tbody>`;
    for (const sid of ids) {
      const cells = live.map((x) => x.times.filter((t) => (t.stopId || "") === sid));
      if (!cells.some((c) => c.length)) continue;
      const st = state.doc.stops.find((x) => x.id === sid);
      html += `<tr><td><b>${esc(st?.name || "No location set")}</b>${st?.note ? `<small>${esc(st.note)}</small>` : ""}</td>${cells.map((c) => `<td>${c.length ? c.map((t) => esc(fmtTime(t.start))).join("<br>") : `<span class="muted">—</span>`}</td>`).join("")}</tr>`;
    }
    html += `</tbody></table></div>`;
    const off = runs.filter((x) => x.cancelled);
    if (off.length) html += `<p class="muted small">Not running today: ${off.map((x) => esc(x.activity.name)).join(", ")}</p>`;
    return html;
  }
  const stopNote = (id) => state.doc.stops.find((k) => k.id === id)?.note || "";
  const card = (a) => {
    const x = runs.find((y) => y.activity === a);
    const ed = state.canEdit
      ? `<div class="btnrow no-print" style="margin-top:.6rem">${(x?.slots || []).map((sl) => `<button class="btn ghost small" data-action="editSlot" data-id="${sl.id}">Edit times${x.slots.length > 1 ? ` (${esc(daysLabel(sl.days))})` : ""}</button>`).join("")}<button class="btn ghost small" data-action="editSlot" data-act="${a.id}">+ Add times</button>${(x?.slots || []).map((sl) => `<button class="btn ghost small danger" data-action="delSlot" data-id="${sl.id}">Clear times${x.slots.length > 1 ? ` (${esc(daysLabel(sl.days))})` : ""}</button>`).join("")}<button class="btn ghost small" data-action="newRun" data-from="${a.id}">Duplicate run</button><button class="btn ghost small danger" data-action="delActivity" data-id="${a.id}">Remove run</button></div>`
      : "";
    const body = !x
      ? `<p class="muted small" style="margin:.25rem 0 0">${r.closure ? "Park closed." : "No times on this day."}</p>`
      : x.cancelled
        ? `<span class="tchip off">${x.cut ? "After closing" : "Not running"}</span>`
        : `<table class="list"><tbody>${x.times.map((t) => `<tr><td>${esc(fmtTime(t.start))}</td><td>${t.stopId ? esc(stopName(t.stopId)) : `<span class="muted">—</span>`}${stopNote(t.stopId) ? `<small>${esc(stopNote(t.stopId))}</small>` : ""}</td></tr>`).join("")}</tbody></table>`;
    return `<div class="card trcard"><div class="tr-head"><div><b>${esc(a.name)}</b>${a.notes ? `<small>${esc(a.notes)}</small>` : ""}</div>${x ? (x.source ? programChip(x.source) : `<span class="chip t-base">Regular</span>`) : ""}</div>
      ${body}${(x?.notes || []).map((n) => `<div class="muted small">${esc(n)}</div>`).join("")}${ed}</div>`;
  };
  html += `<div class="trcards">${state.doc.activities.filter(isTransport).map(card).join("")}</div>`;
  if (state.canEdit) html += `<p class="muted small no-print">“Edit times” changes this run’s times on every day that entry covers. To change times for a season or a few dates only, add the times under that season in <b>Seasons &amp; Events</b>.</p>`;
  return html;
}

// New bus run: blank, or copied from another run with its stops shifted to a new first pickup time.
function runForm(fromId = "") {
  const runs = state.doc.activities.filter(isTransport);
  const src = runs.find((a) => a.id === fromId);
  const dlg = openModal(src ? `Duplicate “${src.name}”` : "New bus run", `
    <label>Run name<input name="name" required maxlength="80" value="${src ? esc(src.name + " (copy)") : ""}" placeholder="e.g. Morning Pickup — Bus 2"></label>
    <label>Notes <span class="muted small">(optional)</span><input name="notes" maxlength="200" value="${esc(src?.notes || "")}" placeholder="e.g. Hotel pickups to PCC"></label>
    <label>Copy stops from<select name="from">${opt("", "— none, I'll add stops myself —", fromId)}${runs.map((a) => opt(a.id, a.name, fromId)).join("")}</select></label>
    <div data-copyonly><label>First pickup at <span class="muted small">(optional — shifts every stop by the same amount)</span><input type="time" name="first"></label>
      <p class="muted small" data-firsthint style="margin-top:-.4rem"></p></div>`, (f) => {
    const fd = new FormData(f), name = fd.get("name").trim(), from = fd.get("from"), first = fd.get("first");
    if (!name) return "Give the run a name.";
    const srcSlots = from ? state.doc.slots.filter((s) => s.activityId === from && s.programId == null) : [];
    const firstOf = srcSlots.flatMap((s) => s.times).map((t) => toMin(t.start)).sort((a, b) => a - b)[0];
    const shift = first && firstOf != null ? toMin(first) - firstOf : 0;
    const moved = (t) => { const m = toMin(t.start) + shift; return m >= 0 && m < 1440 ? { ...t, start: `${pad(Math.floor(m / 60))}:${pad(m % 60)}`, end: "" } : null; };
    if (srcSlots.some((s) => s.times.some((t) => !moved(t)))) return "That shift pushes a stop past midnight. Pick an earlier first pickup.";
    const aid = uid("a");
    commit(`Added bus run “${name}”${from ? ` (stops copied from ${byId("activities", from)?.name}${shift ? `, first pickup ${fmtTime(first)}` : ""})` : ""}`, (doc) => {
      if (!doc.categories.some((c) => c.id === "transport")) doc.categories.push({ id: "transport", name: "Transportation", color: 8 });
      const lastT = doc.activities.findLastIndex((x) => x.category === "transport");
      doc.activities.splice(lastT < 0 ? doc.activities.length : lastT + 1, 0, { id: aid, name, category: "transport", venueId: "", notes: fd.get("notes").trim() });
      for (const s of srcSlots) doc.slots.push({ id: uid("s"), activityId: aid, programId: null, days: [...s.days], status: s.status, note: s.note || "", times: s.times.map(moved) });
    });
  }, src ? "Duplicate" : "Add run");
  const sync = () => {
    const from = $("select[name=from]", dlg).value;
    $("[data-copyonly]", dlg).hidden = !from;
    const t = state.doc.slots.filter((s) => s.activityId === from && s.programId == null).flatMap((s) => s.times).sort((a, b) => toMin(a.start) - toMin(b.start));
    $("[data-firsthint]", dlg).textContent = t.length ? `Copies ${t.length} stop${t.length > 1 ? "s" : ""}, currently ${fmtTime(t[0].start)} – ${fmtTime(t[t.length - 1].start)}.` : from ? "That run has no stops yet." : "";
  };
  $("select[name=from]", dlg).addEventListener("change", sync);
  sync();
}

function stopForm(id) {
  const v = id ? state.doc.stops.find((x) => x.id === id) : { name: "", note: "" };
  openModal(id ? "Edit pickup location" : "New pickup location", `<label>Name<input name="name" value="${esc(v.name)}" required maxlength="80" placeholder="e.g. Hilton Hawaiian Village"></label>
    <label>Where to wait <span class="muted small">(optional)</span><input name="note" value="${esc(v.note)}" maxlength="200" placeholder="e.g. Rainbow Tower bus stop, Ala Moana Blvd"></label>`, (f) => {
    const fd = new FormData(f), name = fd.get("name").trim(), note = fd.get("note").trim();
    if (!name) return "Name is required.";
    commit(`${id ? "Updated" : "Added"} pickup location “${name}”`, (doc) => {
      if (id) Object.assign(doc.stops.find((x) => x.id === id), { name, note });
      else doc.stops.push({ id: uid("t"), name, note });
    });
  });
}

// Business hours, laid out like a public listing: weekly main hours + special hours by date.
function weeklyHours() {
  const m = mainAct();
  return DAYS_LONG.map((name, d) => {
    if (state.doc.closedDays.includes(d)) return { d, name, closed: true, times: [] };
    const times = m ? state.doc.slots.filter((s) => s.programId == null && s.activityId === m.id && s.days.includes(d) && s.status !== "cancelled").flatMap((s) => s.times) : [];
    return { d, name, closed: !times.length, times: times.sort((a, b) => toMin(a.start) - toMin(b.start)) };
  });
}
const hoursTxt = (times) => times.map((t) => (t.end ? `${fmtTime(t.start)} – ${fmtTime(t.end)}` : `from ${fmtTime(t.start)}`)).join(", ");

function specialHours(days = 400) {
  const out = [], m = mainAct(), from = todayStr();
  for (let i = 0; i < days; i++) {
    const ds = addDays(from, i);
    const ov = overrideOn(ds);
    const dated = state.doc.closures.filter((c) => closureHits(c, ds));
    if (!ov && !dated.length) continue;
    const r = resolveDay(ds);
    const row = m && r.rows.find((x) => x.activity === m);
    const label = ov ? ov.reason : r.closure ? r.closure.name : r.earlyClose ? r.earlyClose.name : dated[0]?.name;
    out.push({ ds, label: label || "", closed: !!r.closure || !row || row.cancelled, times: row && !row.cancelled ? row.times : [], ov, early: !r.closure && r.earlyClose });
  }
  return out;
}

function hoursView() {
  const wk = weeklyHours(), today = dow(todayStr()), m = mainAct(), sp = specialHours();
  const pencil = (action, label) => (state.canEdit ? `<button class="btn ghost small no-print" data-action="${action}" aria-label="${label}">✎ Edit</button>` : "");
  let html = `<div class="hours"><div class="viewhead"><div><h1>Business hours</h1><p class="muted small">${m ? `Main hours come from <b>${esc(m.name)}</b>.` : "Add a “Park Hours” activity to show main hours here."}</p></div>
    <button class="btn ghost no-print" data-action="copyHours">Copy as text</button></div>`;
  html += `<div class="card hcard"><div class="hhead"><h2>Hours</h2>${pencil("editWeekHours", "Edit weekly hours")}</div><div class="hsub">Open with main hours</div>
    <table><tbody>${wk.map((w) => `<tr class="${w.d === today ? "today" : ""}"><td>${esc(w.name)}</td><td>${w.closed ? "Closed" : esc(hoursTxt(w.times))}</td></tr>`).join("")}</tbody></table></div>`;
  html += `<div class="card hcard"><div class="hhead"><h2>Special hours</h2>${state.canEdit ? `<button class="btn small no-print" data-action="addSpecial">+ Add date</button>` : ""}</div>
    <div class="hsub">Holidays and one-off changes, from today.</div>
    ${sp.length ? `<table><tbody>${sp.map((x) => `<tr><td>${esc(fmtDate(x.ds, { month: "short", day: "numeric", year: "numeric" }))}<span class="lbl">${esc(fmtDate(x.ds, { weekday: "long" }))}</span></td>
      <td>${x.label ? `<span class="lbl">${esc(x.label)}</span>` : ""}${x.closed ? `<span class="closedtxt">Closed</span>` : esc(hoursTxt(x.times))}${x.early ? ` <span class="muted small">(closes ${esc(fmtTime(x.early.from))})</span>` : ""}</td>

}

function weekHoursForm() {
  const wk = weeklyHours(), m = mainAct();
  if (!m) return toast("Add a “Park Hours” activity under Operational Hours first.", true);
  openModal("Edit weekly hours", `<p class="muted small">Unchecked days are closed every week. Times set the regular <b>${esc(m.name)}</b>.</p>
    ${wk.map((w) => `<div class="wkrow"><label class="day" style="margin:0"><input type="checkbox" name="open" value="${w.d}" ${w.closed ? "" : "checked"}>${esc(w.name)}</label>
      <input type="time" name="s${w.d}" value="${esc(w.times[0]?.start || "12:15")}" aria-label="${esc(w.name)} opens"><span class="to">to</span>
      <input type="time" name="e${w.d}" value="${esc(w.times[w.times.length - 1]?.end || "21:00")}" aria-label="${esc(w.name)} closes"><span></span></div>`).join("")}
    <button type="button" class="btn ghost small" data-copyfirst>Copy first open day's times to all open days</button>`, (f) => {
    const fd = new FormData(f), open = fd.getAll("open").map(Number);
    const hrs = {};
    for (const d of open) {
      const st = fd.get(`s${d}`), en = fd.get(`e${d}`);
      if (!st) return `Enter an opening time for ${DAYS_LONG[d]}.`;
      if (en && toMin(en) <= toMin(st)) return `${DAYS_LONG[d]}: closing time must be after opening time.`;
      hrs[d] = { start: st, end: en || "" };
    }
    const groups = {};
    for (const d of open) { const k = `${hrs[d].start}-${hrs[d].end}`; (groups[k] ||= { t: hrs[d], days: [] }).days.push(d); }
    commit(`Updated weekly hours: ${open.length ? open.map((d) => `${DAYS[d]} ${hoursTxt([hrs[d]])}`).join(", ") : "closed every day"}`.slice(0, 200), (doc) => {
      doc.closedDays = [0, 1, 2, 3, 4, 5, 6].filter((d) => !open.includes(d));
      const keep = doc.slots.filter((s) => !(s.programId == null && s.activityId === m.id));
      const old = doc.slots.find((s) => s.programId == null && s.activityId === m.id);
      doc.slots = [...keep, ...Object.values(groups).map((g, i) => ({ id: i === 0 && old ? old.id : uid("s"), activityId: m.id, programId: null, days: g.days, times: [g.t], status: "running", note: i === 0 && old ? old.note || "" : "" }))];
    });
  }, "Save", (e, dlg) => {
    if (!e.target.closest("[data-copyfirst]")) return;
    const rows = [...dlg.querySelectorAll(".wkrow")].filter((r) => r.querySelector("input[type=checkbox]").checked);
    if (!rows.length) return;
    const [s0, e0] = [...rows[0].querySelectorAll("input[type=time]")].map((x) => x.value);
    for (const r of rows) { const [a, b] = r.querySelectorAll("input[type=time]"); a.value = s0; b.value = e0; }
  });
}

function specialForm(existing = null) {
  const ds = existing?.date || state.date, d0 = dow(ds), wk = weeklyHours();
  const def = existing?.hours || (wk[d0].closed ? wk[nextOpenDay(d0)].times[0] : wk[d0].times[0]) || { start: "12:15", end: "21:00" };
  const run0 = existing && Number.isInteger(existing.runAs) ? existing.runAs : state.doc.closedDays.includes(d0) ? nextOpenDay(d0) : d0;
  const dlg = openModal(existing ? "Edit special hours" : "Add special hours", `
    <label>Date<input type="date" name="date" value="${esc(ds)}" required></label>
    <label>Label <span class="muted small">(optional)</span><input name="reason" value="${esc(existing?.reason || "")}" maxlength="80" placeholder="e.g. Thanksgiving, Christmas Eve"></label>
    <fieldset><legend>This day is</legend><div class="days">
      <label class="day"><input type="radio" name="status" value="open" ${existing?.status === "closed" ? "" : "checked"}>Open</label>
      <label class="day"><input type="radio" name="status" value="closed" ${existing?.status === "closed" ? "checked" : ""}>Closed</label></div></fieldset>
    <div data-openonly>
      <div class="two"><label>Opens<input type="time" name="hs" value="${esc(def.start || "")}"></label><label>Closes<input type="time" name="he" value="${esc(def.end || "")}"></label></div>
      <label>Shows &amp; activities follow the schedule of<select name="runAs">${weekdayOpts(run0)}</select></label>
      <p class="muted small" style="margin-top:-.4rem">Anything after closing time is dropped or shortened. Special events still run.</p>
    </div>`, (f) => {
    const fd = new FormData(f), dt = fd.get("date"), status = fd.get("status"), reason = fd.get("reason").trim();
    const o = { id: existing?.id || uid("o"), date: dt, status, reason };
    if (status === "open") {
      const hs = fd.get("hs"), he = fd.get("he");
      if (!hs) return "Enter an opening time.";
      if (he && toMin(he) <= toMin(hs)) return "Closing time must be after opening time.";
      Object.assign(o, { runAs: Number(fd.get("runAs")), hours: { start: hs, end: he || "" } });
    }
    state.date = dt;
    commit(`Special hours ${fmtShort(dt)}: ${reason ? `${reason} — ` : ""}${status === "closed" ? "Closed" : hoursTxt([o.hours])}`, (doc) => putOverride(doc, o));
  });
  const sync = () => { $("[data-openonly]", dlg).hidden = $("input[name=status]:checked", dlg).value !== "open"; };
  dlg.addEventListener("change", (e) => {
    if (e.target.name === "status") sync();
    if (e.target.name === "date" && e.target.value && !existing) {
      const d = dow(e.target.value);
      $("select[name=runAs]", dlg).value = String(state.doc.closedDays.includes(d) ? nextOpenDay(d) : d);
    }
  });
  sync();
}

// Upcoming closed days and early closings, for everyone.
function closuresView() {
  const from = todayStr(), n = state.closRange;
  const items = [];
  for (let i = 0; i < n; i++) {
    const ds = addDays(from, i);
    const { closure, earlyClose, opening } = closuresFor(ds);
    if (closure && (closure.weekly ? state.closWeekly : true)) items.push({ ds, kind: "closed", c: closure });
    else if (opening && (opening.override || state.closWeekly)) items.push({ ds, kind: "open", c: { name: opening.name, note: openingNote(ds, opening) } });
    if (!closure && earlyClose) items.push({ ds, kind: "early", c: earlyClose });
  }
  let html = `<div class="viewhead"><div><h1>Upcoming closures</h1><p class="muted">Every day the park is closed, closes early, or opens on a normally closed day, starting today.</p></div>${
    state.canEdit ? `<button class="btn ghost" data-action="manageClosures">Edit closures</button>` : ""}</div>
    <div class="ctrls no-print"><label>Show next <select data-action="closRange">${[30, 90, 180, 365].map((d) => opt(String(d), `${d} days`, String(n))).join("")}</select></label>
    <label><input type="checkbox" data-action="closWeekly" ${state.closWeekly ? "checked" : ""}> Include weekly closed days</label>
    <span class="muted small">${items.filter((x) => x.kind === "closed").length} closed · ${items.filter((x) => x.kind === "early").length} early close · ${items.filter((x) => x.kind === "open").length} special opening</span></div>`;
  if (!items.length) return html + `<div class="card empty">No closures in the next ${n} days.</div>`;
  let month = "";
  html += `<div class="tablewrap"><table class="list closlist"><thead><tr><th>Date</th><th>Status</th><th>Reason</th></tr></thead><tbody>`;
  for (const x of items) {
    const m = fmtDate(x.ds, { month: "long", year: "numeric" });
    if (m !== month) { month = m; html += `<tr class="month"><td colspan="3">${esc(m)}</td></tr>`; }
    html += `<tr><td class="nowrap"><a href="#" data-action="goday" data-d="${x.ds}">${esc(fmtDate(x.ds, { weekday: "short", month: "short", day: "numeric" }))}</a></td>
      <td>${x.kind === "closed" ? `<span class="chip t-closed">Closed all day</span>` : x.kind === "open" ? `<span class="chip t-open">Open</span>` : `<span class="chip t-early">Closes at ${esc(fmtTime(x.c.from))}</span>`}</td>
      <td><b>${esc(x.c.name)}</b>${x.c.note ? `<small>${x.kind === "open" ? x.c.note : esc(x.c.note)}</small>` : ""}</td></tr>`;
  }
  return html + `</tbody></table></div>`;
}

function programsView() {
  if (state.programId) return programDetail();

    state.canEdit ? `<button class="btn" data-action="editProgram">+ New</button>` : ""}</div>`;

// 12-month strip starting this month.
function timeline(progs) {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(now.getFullYear(), now.getMonth() + 12, 1);
  const span = end - start;
  const pct = (s) => Math.min(100, Math.max(0, ((parse(s) - start) / span) * 100));
  const visible = progs.filter((p) => parse(p.end) >= start && parse(p.start) < end);
  if (!visible.length) return "";
  const months = Array.from({ length: 12 }, (_, i) => new Date(start.getFullYear(), start.getMonth() + i, 1));
  return `<div class="timeline card">
    <div class="tl-months">${months.map((m) => `<span>${m.toLocaleDateString("en-US", { month: "short" })}</span>`).join("")}</div>
    ${visible.map((p) => {
      const l = pct(p.start), r = pct(addDays(p.end, 1));
      return `<div class="tl-row"><button class="tl-bar t-${p.type}" style="left:${l}%;width:${Math.max(r - l, 0.6)}%" data-action="openProgram" data-id="${p.id}" title="${esc(p.name)}"><span>${esc(p.name)}</span></button></div>`;
    }).join("")}
    <div class="tl-now" style="--p:${pct(todayStr())}"></div>
  </div>`;
}

function slotTable(slots, { showActivity = true } = {}) {
  if (!slots.length) return `<div class="card empty">No times entered yet.</div>`;
  const sorted = [...slots].sort((a, b) => {
    const an = byId("activities", a.activityId)?.name || "", bn = byId("activities", b.activityId)?.name || "";
    return an.localeCompare(bn) || (a.times[0]?.start || "").localeCompare(b.times[0]?.start || "");
  });
  return `<div class="tablewrap"><table class="list"><thead><tr>${showActivity ? "<th>Activity</th>" : ""}<th>Days</th><th>Times</th><th>Note</th>${state.canEdit ? "<th></th>" : ""}</tr></thead><tbody>${sorted
    .map((s) => {
      const a = byId("activities", s.activityId);
      return `<tr>${showActivity ? `<td><b>${esc(a?.name || "(deleted activity)")}</b><small>${esc(venueName(a?.venueId))}</small></td>` : ""}
        <td>${esc(daysLabel(s.days))}</td>
        <td>${s.status === "cancelled" ? `<span class="tchip off">Not running</span>` : s.times.map(tchip).join(" ")}</td>
        <td class="muted">${esc(s.note)}</td>
        ${state.canEdit ? `<td class="actions"><button class="btn ghost small" data-action="editSlot" data-id="${s.id}">Edit</button><button class="btn ghost small danger" data-action="delSlot" data-id="${s.id}">Delete</button></td>` : ""}</tr>`;
    })
    .join("")}</tbody></table></div>`;
}

const firstStart = (s) => (s.times[0] ? toMin(s.times[0].start) : 9999);

// Regular schedule grouped by time of day: each time goes in the block its start falls in.
function baseByTime() {
  const regular = state.doc.slots.filter((s) => s.programId == null && byId("activities", s.activityId));
  let html = `<p class="muted small no-print">Times are placed by when they start. Rename the blocks or change where they begin with <b>Edit time blocks</b>.</p>`;
  for (const b of blocks()) {
    const items = regular
      .filter((s) => s.status !== "cancelled")
      .map((s) => ({ s, times: isTransport(byId("activities", s.activityId)) ? (s.times.length && blockOf(s.times[0].start) === b ? s.times : []) : s.times.filter((t) => blockOf(t.start) === b) }))
      .filter((x) => x.times.length)
      .sort((x, y) => toMin(x.times[0].start) - toMin(y.times[0].start));
    html += `<section class="group${colCls(`basetb:${b.id}`)}">${catHead(`basetb:${b.id}`, `${esc(b.name)} <span class="count">· ${esc(blockSpan(b))} · ${items.length}</span>`, `style="--cc: var(--brand)"`)}`;
    html += items.length ? `<div class="tablewrap"><table class="list tb"><tbody>${items.map(({ s, times }) => {
      const a = byId("activities", s.activityId), c = catOf(a);
      return `<tr><td><b>${esc(a.name)}</b><small><span class="dot" style="--tc: var(--c-${c.color})"></span> ${esc(c.name)}${a.venueId ? ` · ${esc(venueName(a.venueId))}` : ""}</small></td>

function moveActivity(id, catId, beforeId) {
  const a = byId("activities", id), c = cats().find((k) => k.id === catId);
  if (!a || !c || beforeId === id) return;
  const same = catOf(a) === c;
  commit(same ? `Reordered “${a.name}” in ${c.name}` : `Moved “${a.name}” to ${c.name}`, (doc) => {
    const [act] = doc.activities.splice(doc.activities.findIndex((x) => x.id === id), 1);
    act.category = catId;
    let j = beforeId ? doc.activities.findIndex((x) => x.id === beforeId) : -1;
    if (j < 0) {
      const last = doc.activities.findLastIndex((x) => catOf(x).id === catId);
      j = last < 0 ? doc.activities.length : last + 1;
    }
    doc.activities.splice(j, 0, act);
  });
}

function stepActivity(id, dir) {
  const a = byId("activities", id), c = catOf(a);
  const list = state.doc.activities.filter((x) => catOf(x) === c);
  const other = list[list.indexOf(a) + dir];
  if (!other) return;
  commit(`Reordered “${a.name}” in ${c.name}`, (doc) => {
    const i = doc.activities.findIndex((x) => x.id === a.id), k = doc.activities.findIndex((x) => x.id === other.id);
    [doc.activities[i], doc.activities[k]] = [doc.activities[k], doc.activities[i]];
  });
}

  openModal("Edit categories", `<p class="muted small">Name your groups however your team thinks about the day, for example <i>Islands of Polynesia</i>, <i>Dinner</i>, <i>Night Show</i>. The order here is the order on the schedule.</p>

    <button type="button" class="btn ghost small" data-rowadd>+ Add category</button>
    <p class="muted small">Removing a category moves its activities to the first category in the list.</p>`, (f) => {
    const fd = new FormData(f);

function blocksForm() {
  const row = (b) => `<div class="crow"><input type="hidden" name="bid" value="${esc(b.id)}"><input name="bname" value="${esc(b.name)}" required maxlength="40" aria-label="Block name" placeholder="e.g. Evening">
    <label class="muted small" style="margin:0">starts <input type="time" name="bstart" value="${esc(b.start)}" required aria-label="Starts at"></label>
    <button type="button" class="btn ghost small danger" data-rowdel aria-label="Remove">✕</button></div>`;
  openModal("Edit time blocks", `<p class="muted small">Each block runs from its start time until the next block starts. Times before the earliest block go in the first one.</p>
    <div class="rowlist">${blocks().map(row).join("")}</div>
    <button type="button" class="btn ghost small" data-rowadd>+ Add block</button>`, (f) => {
    const fd = new FormData(f);
    const ids = fd.getAll("bid"), names = fd.getAll("bname").map((x) => x.trim()), starts = fd.getAll("bstart");
    if (!ids.length) return "Keep at least one time block.";
    if (names.some((n) => !n) || starts.some((t) => !t)) return "Every block needs a name and a start time.";
    if (new Set(starts).size !== starts.length) return "Two blocks can't start at the same time.";
    const list = ids.map((id, i) => ({ id, name: names[i], start: starts[i] })).sort((a, b) => toMin(a.start) - toMin(b.start));
    commit(`Updated time blocks: ${list.map((b) => `${b.name} ${fmtTime(b.start)}`).join(", ")}`.slice(0, 200), (doc) => { doc.timeBlocks = list; });
  }, "Save", (e, dlg) => rowEditor(e, dlg, () => row({ id: uid("b"), name: "", start: "" })));
}

// Shared add / remove / reorder for the row lists in the two forms above.
function rowEditor(e, dlg, newRow) {
  const rowEl = e.target.closest(".crow"), list = $(".rowlist", dlg);
  if (e.target.closest("[data-rowadd]")) { list.insertAdjacentHTML("beforeend", newRow()); list.lastElementChild.querySelector("input:not([type=hidden])")?.focus(); }
  else if (e.target.closest("[data-rowdel]")) { if (list.children.length > 1) rowEl.remove(); else toast("Keep at least one.", true); }
  else if (e.target.closest("[data-rowup]") && rowEl.previousElementSibling) list.insertBefore(rowEl, rowEl.previousElementSibling);
  else if (e.target.closest("[data-rowdown]") && rowEl.nextElementSibling) list.insertBefore(rowEl.nextElementSibling, rowEl);
}
