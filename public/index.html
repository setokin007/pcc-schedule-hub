let logLoading = false;
async function loadLog() {
  if (logLoading) return;
  if (!logRef) { state.log = []; render(); return; }
  logLoading = true;
  try {
    const snap = await logRef.get();
    state.log = snap.exists ? snap.data().entries || [] : [];
    const ids = [...new Set(state.log.map((e) => e.by).filter(Boolean))];
    if (userApi && ids.length) {
      const ps = await userApi.profiles(ids);
      for (const id of ids) state.names[id] = ps[id]?.name || "";
    }
  } catch { state.log = []; }
  logLoading = false;
  if (state.view === "log") render();
}


// ---------- modals ----------
function openModal(title, body, onSubmit, submitLabel = "Save", onClick = null) {
  const dlg = document.createElement("dialog");
  dlg.innerHTML = `<form method="dialog" class="modal"><h2>${esc(title)}</h2>${body}
    <div class="btnrow end"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" value="ok">${esc(submitLabel)}</button></div></form>`;
  document.body.append(dlg);
  const form = $("form", dlg);
  dlg.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) dlg.close();
    const add = e.target.closest("[data-addtime]");
    if (add) $(".times", dlg).insertAdjacentHTML("beforeend", timeRow({ start: "", end: "" }));
    const rm = e.target.closest("[data-rmtime]");
    if (rm) rm.closest(".trow").remove();
    onClick?.(e, dlg);
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const err = onSubmit(form);
    if (typeof err === "string") { $(".err", dlg)?.remove(); form.insertAdjacentHTML("afterbegin", `<p class="err">${esc(err)}</p>`); return; }
    dlg.close();
  });
  dlg.addEventListener("close", () => dlg.remove());
  dlg.showModal();
  $("input, select, textarea", dlg)?.focus();
  return dlg;
}

// Parse one clock time: "2pm", "2:30 pm", "14:30", "1230", "8:30p". Bare 1–7 o'clock means PM.
function parseClock(raw, forcePm = null) {
  const m = String(raw).trim().toLowerCase().replace(/\./g, "").match(/^(\d{1,2})(?::?(\d{2}))?\s*(am|pm|a|p|noon)?$/);
  if (!m) return null;
  let h = Number(m[1]); const mi = Number(m[2] || 0); let ap = m[3] || forcePm;
  if (h > 23 || mi > 59) return null;
  if (ap && ap.startsWith("p") && h < 12) h += 12;
  else if (ap && ap.startsWith("a") && h === 12) h = 0;
  else if (!ap && h >= 1 && h <= 7) h += 12;
  return { t: `${pad(h)}:${pad(mi)}`, explicit: !!m[3] };
}
// "12:30, 2pm, 3:30 pm" → start times; "11:00 - 8:30p" or "1–3pm" or "11 to 2" → a time span.
function parseEntries(text) {
  const out = [], bad = [];
  for (const chunk of String(text).split(/[,;\n]+/).map((x) => x.trim()).filter(Boolean)) {
    const rng = chunk.split(/\s*(?:–|—|-|\bto\b|\buntil\b)\s*/i).filter(Boolean);
    if (rng.length === 2) {
      const b = parseClock(rng[1]);
      let a = parseClock(rng[0]);
      if (!a || !b) { bad.push(chunk); continue; }
      // "1-3pm": carry the end's pm to an unmarked start when that keeps start before end
      if (!a.explicit && b.explicit && toMin(a.t) >= toMin(b.t)) { const a2 = parseClock(rng[0], /pm|p$/i.test(rng[1]) ? "pm" : "am"); if (a2 && toMin(a2.t) < toMin(b.t)) a = a2; }
      let e = b.t;
      if (toMin(e) <= toMin(a.t) && !b.explicit && toMin(e) + 720 < 1440) e = plusMin(e, 720);
      if (toMin(e) <= toMin(a.t)) { bad.push(chunk); continue; }
      out.push({ start: a.t, end: e });
      continue;
    }
    for (const tok of chunk.split(/\s+(?=\d)/)) { const c = parseClock(tok); c ? out.push({ start: c.t, end: "" }) : bad.push(tok); }
  }
  const seen = new Set();
  return { entries: out.filter((x) => (seen.has(x.start + x.end) ? false : seen.add(x.start + x.end))).sort((x, y) => toMin(x.start) - toMin(y.start)), bad };
}
const parseTimes = (text) => { const { entries, bad } = parseEntries(text); return { times: entries.map((e) => e.start), bad }; };
const plusMin = (hhmm, n) => { const t = toMin(hhmm) + n; return t >= 24 * 60 ? "" : `${pad(Math.floor(t / 60))}:${pad(t % 60)}`; };

// Three ways to enter times quickly: a list of start times, one open–close span, or a repeating series.
const quickBlock = (withButton = true) => `<div class="quick">
    <div class="days qmode" role="radiogroup" aria-label="How to enter times">
      <label class="day"><input type="radio" name="qmode" value="list" checked>Start times</label>
      <label class="day"><input type="radio" name="qmode" value="span">Time span</label>
      <label class="day"><input type="radio" name="qmode" value="rep">Repeating</label></div>
    <div class="qrow" data-m="list"><input name="qtimes" placeholder="e.g. 12:30, 2pm, 3:30 pm — or a span like 11:00–8:30p" aria-label="Start times"><span class="small">length</span><input type="number" name="qdur" min="0" max="900" step="5" placeholder="Length (min)" aria-label="Length in minutes"></div>
    <div class="qrow" data-m="span"><span class="small">From</span><input type="time" name="qs1" aria-label="Opens"><span class="small">to</span><input type="time" name="qs2" aria-label="Closes"></div>
    <div class="qrow" data-m="rep"><span class="small">First at</span><input type="time" name="qfrom" aria-label="First start"><span class="small">every</span><input type="number" name="qevery" min="5" max="600" step="5" placeholder="min" aria-label="Every minutes"><span class="small">until</span><input type="time" name="qto" aria-label="Last start"><span class="small">length</span><input type="number" name="qdur2" min="0" max="600" step="5" placeholder="Length (min)" aria-label="Length in minutes"></div>
    ${withButton ? `<div class="qrow"><button type="button" class="btn ghost small" data-qgo>Add these times</button></div>` : ""}
    <div class="qhint" data-m="list">Separate start times with commas. Use a dash for a span (11:00–8:30p). Without am/pm, 1–7 means PM.</div>
    <div class="qhint" data-m="span">One block of time, e.g. opening hours 11:00 AM – 8:30 PM.</div>
    <div class="qhint" data-m="rep">e.g. first at 12:30, every 90 min, until 6:30 → 12:30, 2:00, 3:30, 5:00, 6:30.</div></div>`;
// Read the quick block. Returns null when nothing was entered, or { error } / { entries }.
function readQuick(root) {
  const v = (n) => root.querySelector(`[name="${n}"]`)?.value?.trim() || "";
  const mode = root.querySelector("input[name=qmode]:checked")?.value || "list";
  if (mode === "list") {
    if (!v("qtimes")) return null;
    const { entries, bad } = parseEntries(v("qtimes"));
    if (bad.length) return { error: `Couldn't read: ${bad.join(", ")}` };
    const dur = Number(v("qdur")) || 0;
    return { entries: entries.map((e) => (e.end || !dur ? e : { start: e.start, end: plusMin(e.start, dur) })) };
  }
  if (mode === "span") {
    if (!v("qs1") && !v("qs2")) return null;
    if (!v("qs1") || !v("qs2")) return { error: "Enter both the start and end of the time span." };
    if (toMin(v("qs2")) <= toMin(v("qs1"))) return { error: "The span must end after it starts." };
    return { entries: [{ start: v("qs1"), end: v("qs2") }] };
  }
  if (!v("qfrom") && !v("qto")) return null;
  const ev = Number(v("qevery")), dur = Number(v("qdur2")) || 0;
  if (!v("qfrom") || !v("qto") || !ev) return { error: "Fill in first at, every, and until." };
  if (toMin(v("qto")) < toMin(v("qfrom"))) return { error: "“Until” must be after “first at”." };
  const entries = [];
  for (let m = toMin(v("qfrom")); m <= toMin(v("qto")) && entries.length < 60; m += ev) {
    const st = `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
    entries.push({ start: st, end: dur ? plusMin(st, dur) : "" });
  }
  return { entries };
}
function quickAdd(dlg, entries) {
  const box = $(".times", dlg);
  box.querySelectorAll(".trow").forEach((row) => { if (!row.querySelector("input[name=ts]").value) row.remove(); });
  const have = new Set([...box.querySelectorAll("input[name=ts]")].map((i) => i.value));
  for (const e of entries) if (!have.has(e.start)) box.insertAdjacentHTML("beforeend", timeRow(e));
  const rows = [...box.querySelectorAll(".trow")].sort((a, b) => a.querySelector("input[name=ts]").value.localeCompare(b.querySelector("input[name=ts]").value));
  rows.forEach((row) => box.append(row));
  if (!rows.length) box.insertAdjacentHTML("beforeend", timeRow({ start: "", end: "" }));
}
function wireQuick(dlg) {
  const go = () => {
    const q = readQuick($(".quick", dlg));
    if (!q) return toast("Enter some times first.", true);
    if (q.error) return toast(q.error, true);
    quickAdd(dlg, q.entries);
    $(".quick", dlg).querySelectorAll("input:not([type=radio])").forEach((i) => (i.value = ""));
    toast(`Added ${q.entries.length} time${q.entries.length > 1 ? "s" : ""}`);
  };
  dlg.addEventListener("click", (e) => { if (e.target.closest("[data-qgo]")) go(); });
  dlg.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.closest(".quick") && e.target.matches("input:not([type=radio])")) { e.preventDefault(); go(); } });
}

const opt = (v, label, sel) => `<option value="${esc(v)}" ${v === sel ? "selected" : ""}>${esc(label)}</option>`;
const timeRow = (t) => `<div class="trow"><input type="time" name="ts" value="${esc(t.start)}" required aria-label="Start"><select name="tl" class="tl" aria-label="Pickup location">${opt("", "— location (optional) —", t.stopId || "")}${(state.doc.stops || []).map((x) => opt(x.id, x.name, t.stopId || "")).join("")}</select><span class="to">to</span><input type="time" name="te" value="${esc(t.end || "")}" aria-label="End (optional)"><button type="button" class="btn ghost small" data-rmtime aria-label="Remove time">✕</button></div>`;

// "Shows per day" controls above the time rows. Count adds/removes numbered rows; a show length
// fills each End time from its Begin time (until the End is typed by hand).
const showsBar = (count) => `<div class="showsbar"><label>Shows per day<input type="number" name="nshows" min="1" max="24" value="${count}" aria-label="Shows per day"></label>
  <label>Each show lasts<input type="number" name="showlen" min="0" max="600" step="5" placeholder="min" aria-label="Show length in minutes">min</label>
  <span class="muted">Set the number of shows, then enter when each one begins and ends. With a length set, end times fill in for you.</span></div>
  <div class="timehead" aria-hidden="true"><span></span><span>Begins</span><span>to</span><span>Ends</span><span></span></div>`;
function wireShows(dlg) {
  const box = $(".times", dlg), cnt = $("input[name=nshows]", dlg), len = $("input[name=showlen]", dlg);
  if (!box || !cnt || !len) return;
  const rows = () => [...box.querySelectorAll(".trow")];
  const startOf = (r) => r.querySelector("[name=ts]").value, endEl = (r) => r.querySelector("[name=te]");
  const known = rows().find((r) => startOf(r) && endEl(r).value);
  if (known) { const d = toMin(endEl(known).value) - toMin(startOf(known)); if (d > 0 && rows().every((r) => !startOf(r) || !endEl(r).value || toMin(endEl(r).value) - toMin(startOf(r)) === d)) len.value = d; }
  const fillEnd = (r) => {
    const st = startOf(r), e = endEl(r), L = Number(len.value) || 0;
    if (!st || !L || (e.value && !e.dataset.auto)) return;
    const v = plusMin(st, L);
    if (v) { e.value = v; e.dataset.auto = "1"; }
  };
  cnt.addEventListener("change", () => {
    const want = Math.max(1, Math.min(24, Math.round(Number(cnt.value)) || 1));
    cnt.value = want;
    while (rows().length < want) box.insertAdjacentHTML("beforeend", timeRow({ start: "", end: "" }));
    while (rows().length > want) { const rs = rows(); ([...rs].reverse().find((r) => !startOf(r)) || rs[rs.length - 1]).remove(); }
  });
  len.addEventListener("change", () => rows().forEach(fillEnd));
  box.addEventListener("change", (e) => {
    const r = e.target.closest(".trow");
    if (!r) return;
    if (e.target.name === "ts") fillEnd(r);
    if (e.target.name === "te") delete e.target.dataset.auto;
  });
  new MutationObserver(() => {
    if (!rows().length) box.insertAdjacentHTML("beforeend", timeRow({ start: "", end: "" }));
    cnt.value = rows().length;
  }).observe(box, { childList: true });
}
// Begin/End rows from a form, validated. Returns { times } or { error }.
function readRows(fd) {
  const starts = fd.getAll("ts"), ends = fd.getAll("te");
  const times = starts.map((st, i) => ({ start: st, end: ends[i] || "" })).filter((t) => t.start);
  const bad = times.findIndex((t) => t.end && toMin(t.end) <= toMin(t.start));
  if (bad >= 0) return { error: `Show ${bad + 1}: the end time must be after it begins.` };
  return { times };
}

    <label>Reason<input name="name" value="${esc(c.name)}" required maxlength="80" placeholder="e.g. Christmas Day, Early close Wednesdays"></label>
    <div class="two"><label>First date<input type="date" name="start" value="${c.start}" required></label><label>Last date<input type="date" name="end" value="${c.end || c.start}" required></label></div>
    <fieldset><legend>Only on these weekdays <span class="muted small">(leave blank for every day in the range)</span></legend><div class="days">${DAYS.map((dn, i) => `<label class="day"><input type="checkbox" name="cdays" value="${i}" ${c.days?.includes(i) ? "checked" : ""}>${dn}</label>`).join("")}</div></fieldset>
    <label>Closed from <span class="muted small">(optional — leave blank to close all day)</span><input type="time" name="from" value="${esc(c.from || "")}"></label>
    <label>Note<input name="note" value="${esc(c.note)}" maxlength="200"></label>`, (f) => {
    const fd = new FormData(f);
    const v = { name: fd.get("name").trim(), start: fd.get("start"), end: fd.get("end"), note: fd.get("note").trim(),
      days: fd.getAll("cdays").map(Number).sort(), from: fd.get("from") || "" };
    if (v.end < v.start) return "Last date must be on or after the first date.";
    if (v.days.length) {
      let hit = false;
      for (let ds = v.start, i = 0; ds <= v.end && i < 7; ds = addDays(ds, 1), i++) if (v.days.includes(dow(ds))) hit = true;
      if (!hit) return "None of the chosen weekdays fall within these dates.";
    }
    commit(`${id ? "Updated" : "Added"} closure “${v.name}”`, (doc) => {
      if (id) Object.assign(doc.closures.find((x) => x.id === id), v);
      else doc.closures.push({ id: uid("c"), ...v });
    });
  });
}

// ---- date changes ----
const weekdayOpts = (sel) => DAYS_LONG.map((n, i) => opt(String(i), `${n}${state.doc.closedDays.includes(i) ? " (normally closed)" : ""}`, String(sel))).join("");
const putOverride = (doc, o) => { doc.dayOverrides = doc.dayOverrides.filter((x) => x.date !== o.date && x.id !== o.id); doc.dayOverrides.push(o); };

function openDayForm(date = state.date, existing = null) {
  const d0 = dow(date);
  const run0 = existing && Number.isInteger(existing.runAs) ? existing.runAs : state.doc.closedDays.includes(d0) ? nextOpenDay(d0) : d0;
  openModal("Open a day", `<label>Date<input type="date" name="date" value="${esc(existing?.date || date)}" required></label>
    <label>Use the schedule of<select name="runAs">${weekdayOpts(run0)}</select></label>
    <p class="muted small" style="margin-top:-.4rem">The times that normally run on that weekday will run on this date.</p>
    <label>Reason <span class="muted small">(optional)</span><input name="reason" value="${esc(existing?.reason || "")}" maxlength="80" placeholder="e.g. Open Wednesday for Labor Day week"></label>`, (f) => {
    const fd = new FormData(f), dt = fd.get("date"), runAs = Number(fd.get("runAs")), reason = fd.get("reason").trim();
    state.date = dt;
    commit(`Opened ${fmtShort(dt)} (${DAYS_LONG[runAs]} schedule)`, (doc) => putOverride(doc, { id: existing?.id || uid("o"), date: dt, status: "open", runAs, reason }));
  }, "Open this day");
}

function closeDayForm(date = state.date, existing = null) {
  openModal("Close a day", `<label>Date<input type="date" name="date" value="${esc(existing?.date || date)}" required></label>
    <label>Reason <span class="muted small">(optional)</span><input name="reason" value="${esc(existing?.reason || "")}" maxlength="80" placeholder="e.g. Closed Friday — open Wednesday instead"></label>
    <p class="muted small">Special events on this date still show. For a holiday or a range of dates, use Date closures instead.</p>`, (f) => {
    const fd = new FormData(f), dt = fd.get("date"), reason = fd.get("reason").trim();
    state.date = dt;
    commit(`Closed ${fmtShort(dt)}${reason ? ` — ${reason}` : ""}`, (doc) => putOverride(doc, { id: existing?.id || uid("o"), date: dt, status: "closed", reason }));
  }, "Close this day");
}

function swapDaysForm(date = state.date) {
  const closedNow = !!closuresFor(date).closure;
  let openD = date, closeD = date;
  if (closedNow) { closeD = addDays(date, 1); while (closuresFor(closeD).closure && closeD < addDays(date, 14)) closeD = addDays(closeD, 1); }
  else { openD = addDays(date, -1); while (!closuresFor(openD).closure && openD > addDays(date, -7)) openD = addDays(openD, -1); }
  const dlg = openModal("Swap days", `<p class="muted small">Open one date and close another in one step — for example open Wednesday and close Friday.</p>
    <div class="two"><label>Open on<input type="date" name="open" value="${openD}" required></label><label>Close on<input type="date" name="close" value="${closeD}" required></label></div>
    <label><input type="checkbox" name="moveSched" checked> Run the closed day's schedule on the open day <span class="muted small" data-swaphint></span></label>
    <label>Reason <span class="muted small">(optional)</span><input name="reason" maxlength="80" placeholder="e.g. Swapped for a private event"></label>`, (f) => {
    const fd = new FormData(f), o = fd.get("open"), c = fd.get("close"), reason = fd.get("reason").trim();
    if (o === c) return "Pick two different dates.";
    const runAs = fd.get("moveSched") ? dow(c) : state.doc.closedDays.includes(dow(o)) ? nextOpenDay(dow(o)) : dow(o);
    state.date = o;
    commit(`Swapped days: open ${fmtShort(o)}, closed ${fmtShort(c)}`, (doc) => {
      putOverride(doc, { id: uid("o"), date: o, status: "open", runAs, reason: reason || `Swapped — open instead of ${DAYS_LONG[dow(c)]}, ${fmtDate(c, { month: "short", day: "numeric" })}` });
      putOverride(doc, { id: uid("o"), date: c, status: "closed", reason: reason || `Swapped — open ${DAYS_LONG[dow(o)]}, ${fmtDate(o, { month: "short", day: "numeric" })} instead` });
    });
  }, "Swap");
  const hint = () => { const c = $("input[name=close]", dlg).value; $("[data-swaphint]", dlg).textContent = c ? `(${DAYS_LONG[dow(c)]} schedule)` : ""; };
  $("input[name=close]", dlg).addEventListener("change", hint); hint();
}

function confirmDel(what, run) {
  openModal("Delete?", `<p>Delete <b>${esc(what)}</b>? This can't be undone (but it's in the change history and any backups).</p>`, () => { run(); }, "Delete");
}

// ---------- export / import ----------
async function download(name, text) {
  if (!downloadsApi) return toast("Downloads aren’t available in this view.", true);
  try {
    await downloadsApi.save({ filename: name, data: text });
  } catch (e) {
    if (e?.code === "declined") return;
    toast(e?.code === "rate_limited" ? "A save prompt is already open." : "Couldn’t save the file.", true);
  }
}

function exportCsv(from, to) {
  if (to < from) return toast("“To” must be after “From”.", true);
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [["Date", "Day", "Activity", "Category", "Island", "Venue", "Times", "Status", "Source", "Notes"].map(cell).join(",")];
  for (let ds = from, i = 0; ds <= to && i < 731; ds = addDays(ds, 1), i++) {
    const r = resolveDay(ds);
    if (r.closure) lines.push([ds, DAYS[dow(ds)], "PARK CLOSED", "", "", "", "", "closed", r.closure.name, r.closure.note].map(cell).join(","));
    if (r.opening) lines.push([ds, DAYS[dow(ds)], "PARK OPEN (special)", "", "", "", "", "open", r.opening.name, `${DAYS_LONG[r.opening.runAs]} schedule`].map(cell).join(","));
    if (r.earlyClose) lines.push([ds, DAYS[dow(ds)], `PARK CLOSES AT ${fmtTime(r.earlyClose.from)}`, "", "", "", "", "early close", r.earlyClose.name, r.earlyClose.note].map(cell).join(","));
    for (const x of r.rows)
      lines.push([ds, DAYS[dow(ds)], x.activity.name, catName(x.activity.category), islandName(x.activity.islandId), venueName(x.activity.venueId),
        x.times.map(fmtT).join("; "), x.cancelled ? (x.cut ? "after closing" : "not running") : x.cut ? "shortened (early close)" : "running",
        x.source ? `${PROGRAM_TYPES[x.source.type].label}: ${x.source.name}` : "Regular", x.notes.join("; ")].map(cell).join(","));
  }
  download(`pcc-schedule_${from}_to_${to}.csv`, lines.join("\r\n"), "text/csv");
}

async function restore(file) {
  let doc;
  try { doc = JSON.parse(await file.text()); } catch { return toast("That file isn't valid JSON.", true); }
  if (!["venues", "activities", "programs", "slots", "closures"].every((k) => Array.isArray(doc?.[k])))
    return toast("That doesn't look like a Schedule Hub backup.", true);
  confirmDel("ALL current data and replace it with the backup", () =>
    commit(`Restored from backup “${file.name}”`, (d) => {
      for (const k of ["venues", "activities", "programs", "slots", "closures"]) d[k] = doc[k];
      if (Array.isArray(doc.closedDays)) d.closedDays = doc.closedDays;
      if (Array.isArray(doc.categories) && doc.categories.length) d.categories = doc.categories;
      d.stops = Array.isArray(doc.stops) ? doc.stops : [];
      d.islands = Array.isArray(doc.islands) ? doc.islands : structuredClone(DEFAULT_ISLANDS);
      d.dayOverrides = Array.isArray(doc.dayOverrides) ? doc.dayOverrides : [];
      if (Array.isArray(doc.timeBlocks) && doc.timeBlocks.length) d.timeBlocks = doc.timeBlocks;
      d.sample = false;
    }));
}

// ---------- toast ----------
function toast(msg, bad = false) {
  const el = Object.assign(document.createElement("div"), { className: `toast ${bad ? "bad" : ""}`, textContent: msg });
  el.setAttribute("role", "status");
  document.body.append(el);
  setTimeout(() => el.remove(), bad ? 6000 : 2500);
}

    case "editActivity": activityForm(id); break;
    case "editSlot": slotForm(id, el.dataset.program || null, el.dataset.act || ""); break;

      break;
    }
    case "delIsland": {
      const v = islands().find((x) => x.id === id);
      confirmDel(`island ${v.name} (its activities stay, listed under “${PARK_WIDE}”)`, () => commit(`Deleted island “${v.name}”`, (d) => {

          d.programs = d.programs.filter((x) => x.id !== id);

      break;
    }
    case "backup": download(`pcc-schedule-backup_${todayStr()}.json`, JSON.stringify(state.doc, null, 2), "application/json"); break;
    case "startEmpty":
      confirmDel("every activity, time, season, event and closure", () => commit("Cleared sample data", (d) => {
        for (const k of ["venues", "activities", "programs", "slots", "closures"]) d[k] = [];

  }
});

// ---------- drag to regroup: Activities, Regular schedule and Day view ----------
// Mouse uses native drag & drop; touch and pen use pointer events on the ⋮⋮ handle.
let dragId = null;
const clearDrag = () => {
  document.querySelectorAll(".dragging, .dropover, .ghosting").forEach((x) => x.classList.remove("dragging", "dropover", "ghosting"));
  document.querySelectorAll(".dropmark").forEach((x) => x.remove());
  document.body.classList.remove("touchdrag");
};
function placeMark(z, y) {
  document.querySelectorAll(".dropover").forEach((x) => x !== z && x.classList.remove("dropover"));
  z.classList.add("dropover");
  const zone = $(".dropzone", z);
  const before = [...zone.querySelectorAll(".dragitem:not(.dragging)")].find((b) => { const r = b.getBoundingClientRect(); return y < r.top + r.height / 2; });
  let mark = $(".dropmark");
  if (!mark) mark = Object.assign(document.createElement("div"), { className: "dropmark" });
  if (before) { if (mark.nextElementSibling !== before) zone.insertBefore(mark, before); }
  else if (mark.parentElement !== zone || mark.nextElementSibling) zone.append(mark);
}
function finishDrop(z, id) {
  let next = $(".dropmark", z)?.nextElementSibling;
  while (next && (!next.matches(".dragitem") || next.classList.contains("dragging"))) next = next.nextElementSibling;
  clearDrag();
  moveActivity(id, z.dataset.cat, next?.dataset.act || null);
}
document.addEventListener("dragstart", (e) => {
  const b = e.target.closest?.(".dragitem");
  if (!b || e.target.closest("select, button, input")) return;
  dragId = b.dataset.act;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragId);
  requestAnimationFrame(() => b.classList.add("dragging"));
});
document.addEventListener("dragend", () => { dragId = null; clearDrag(); });
document.addEventListener("dragover", (e) => {
  if (!dragId) return;
  const z = e.target.closest(".catzone");
  if (!z) return;
  e.preventDefault();
  placeMark(z, e.clientY);
});
document.addEventListener("drop", (e) => {
  if (!dragId) return;
  const z = e.target.closest(".catzone");
  if (!z) return;
  e.preventDefault();
  const id = dragId; dragId = null;
  finishDrop(z, id);
});

let tdrag = null, scrollTimer = null;
document.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse") return;
  const g = e.target.closest(".grip"), item = g?.closest(".dragitem");
  if (!item) return;
  e.preventDefault();
  tdrag = { id: item.dataset.act, item, y: e.clientY, x: e.clientX };
  item.classList.add("dragging");
  document.body.classList.add("touchdrag");
  try { g.setPointerCapture?.(e.pointerId); } catch {}
  clearInterval(scrollTimer);
  scrollTimer = setInterval(() => {
    if (!tdrag) return;
    const edge = 70, h = window.innerHeight;
    if (tdrag.y < edge) window.scrollBy(0, -14); else if (tdrag.y > h - edge) window.scrollBy(0, 14);
    const z = document.elementFromPoint(tdrag.x, tdrag.y)?.closest(".catzone");
    if (z) placeMark(z, tdrag.y);
  }, 30);
}, { passive: false });
document.addEventListener("pointermove", (e) => {
  if (!tdrag) return;
  e.preventDefault();
  tdrag.x = e.clientX; tdrag.y = e.clientY;
  const z = document.elementFromPoint(e.clientX, e.clientY)?.closest(".catzone");
  if (z) placeMark(z, e.clientY);
}, { passive: false });
const endTouch = (e, cancel) => {
  if (!tdrag) return;
  clearInterval(scrollTimer);
  const id = tdrag.id; tdrag = null;
  const z = !cancel && document.elementFromPoint(e.clientX, e.clientY)?.closest(".catzone");
  if (z && $(".dropmark", z)) finishDrop(z, id); else clearDrag();
};
document.addEventListener("pointerup", (e) => endTouch(e, false));
document.addEventListener("pointercancel", (e) => endTouch(e, true));

// ---------- drag to reorder categories (⠿ handle on category headings) ----------
let catDrag = null; // { id, pos: {target, after} }
const clearCatDrag = () => document.querySelectorAll(".cdragging, .cdrop-before, .cdrop-after").forEach((x) => x.classList.remove("cdragging", "cdrop-before", "cdrop-after"));
function markCat(z, y) {
  if (!catDrag || !z || z.dataset.cat === catDrag.id) return;
  document.querySelectorAll(".cdrop-before, .cdrop-after").forEach((x) => x.classList.remove("cdrop-before", "cdrop-after"));
  const r = z.getBoundingClientRect(), after = y > r.top + Math.min(r.height / 2, 40);
  z.classList.add(after ? "cdrop-after" : "cdrop-before");
  catDrag.pos = { target: z.dataset.cat, after };
}
function finishCatDrop() {
  const d = catDrag; catDrag = null; clearCatDrag();
  if (!d?.pos) return;
  const ids = cats().map((c) => c.id).filter((x) => x !== d.id);
  let i = ids.indexOf(d.pos.target);
  if (i < 0) return;
  ids.splice(d.pos.after ? i + 1 : i, 0, d.id);
  if (ids.join() === cats().map((c) => c.id).join()) return;
  const moved = cats().find((c) => c.id === d.id);
  commit(`Reordered categories: ${ids.map((x) => cats().find((c) => c.id === x)?.name).join(", ")}`.slice(0, 200), (doc) => {
    doc.categories = ids.map((x) => doc.categories.find((c) => c.id === x)).filter(Boolean);
  });
}
document.addEventListener("dragstart", (e) => {
  const g = e.target.closest?.(".cgrip");
  if (!g) return;
  e.stopPropagation();
  catDrag = { id: g.dataset.cgrip };
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", "cat:" + catDrag.id);
  requestAnimationFrame(() => g.closest("section.catzone")?.classList.add("cdragging"));
}, true);
document.addEventListener("dragover", (e) => {
  if (!catDrag) return;
  const z = e.target.closest("section.catzone");
  if (!z) return;
  e.preventDefault();
  markCat(z, e.clientY);
}, true);
document.addEventListener("drop", (e) => {
  if (!catDrag) return;
  e.preventDefault(); e.stopPropagation();
  finishCatDrop();
}, true);
document.addEventListener("dragend", () => { if (catDrag) { catDrag = null; clearCatDrag(); } }, true);

let tcat = null, tcatTimer = null;
document.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse") return;
  const g = e.target.closest(".cgrip");
  if (!g) return;
  e.preventDefault(); e.stopPropagation();
  catDrag = { id: g.dataset.cgrip }; tcat = { x: e.clientX, y: e.clientY };
  g.closest("section.catzone")?.classList.add("cdragging");
  document.body.classList.add("touchdrag");
  try { g.setPointerCapture?.(e.pointerId); } catch {}
  clearInterval(tcatTimer);
  tcatTimer = setInterval(() => {
    if (!tcat) return;
    if (tcat.y < 70) window.scrollBy(0, -14); else if (tcat.y > window.innerHeight - 70) window.scrollBy(0, 14);
    markCat(document.elementFromPoint(tcat.x, tcat.y)?.closest("section.catzone"), tcat.y);
  }, 30);
}, { capture: true, passive: false });
document.addEventListener("pointermove", (e) => {
  if (!tcat) return;
  e.preventDefault();
  tcat = { x: e.clientX, y: e.clientY };
  markCat(document.elementFromPoint(e.clientX, e.clientY)?.closest("section.catzone"), e.clientY);
}, { capture: true, passive: false });
const endCatTouch = (cancel) => {
  if (!tcat) return;
  clearInterval(tcatTimer); tcat = null; document.body.classList.remove("touchdrag");
  if (cancel) { catDrag = null; clearCatDrag(); } else finishCatDrop();
};
document.addEventListener("pointerup", () => endCatTouch(false), true);
document.addEventListener("pointercancel", () => endCatTouch(true), true);

load();

</script>
